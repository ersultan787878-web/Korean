<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안녕! — Путь к корейскому языку · 1000 уроков + AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --fd:'Unbounded','Noto Sans KR',sans-serif;
  --fb:'Rubik','Noto Sans KR',sans-serif;
  --bg:#f5f2ea; --card:#ffffff; --ink:#23262f; --mut:#6d7280;
  --line:#23262f; --sh:#23262f; --soft:#efeadf;
  --red:#e14b3b; --blue:#2f6fe0; --green:#1f9e57; --gold:#eda415; --orange:#e2711d;
  --teal:#0d9e8f; --pink:#c2388f;
}
[data-theme="dark"]{
  --bg:#14161d; --card:#1e222d; --ink:#f1f2f6; --mut:#9aa1b2;
  --line:#3a4152; --sh:#090b10; --soft:#262b38;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background .35s,color .35s}
.kr{font-family:'Noto Sans KR',sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;color:inherit}
::selection{background:var(--gold);color:#23262f}
.hidden{display:none!important}

#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx span{position:absolute;font-family:'Noto Sans KR';font-weight:900;opacity:.05;animation:drift linear infinite;user-select:none}
[data-theme="dark"] #fx span{opacity:.08;color:#8fa2ff}
@keyframes drift{from{transform:translateY(108vh) rotate(-8deg)}to{transform:translateY(-18vh) rotate(10deg)}}

#app{position:relative;z-index:1;display:flex;min-height:100vh}
#side{width:238px;flex-shrink:0;padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--card);border-right:2px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo .tile{width:44px;height:44px;border-radius:13px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:'Noto Sans KR';font-weight:900;font-size:22px;border:2px solid var(--line);box-shadow:3px 3px 0 var(--sh);transform:rotate(-4deg)}
.logo b{font-family:var(--fd);font-size:19px;letter-spacing:.5px}
.logo small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:2px;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:13px;border:2px solid transparent;background:transparent;font-weight:600;font-size:14.5px;text-align:left;transition:.18s}
.navbtn:hover{background:var(--soft);transform:translateX(3px)}
.navbtn.act{background:var(--ink);color:var(--card);border-color:var(--line);box-shadow:3px 3px 0 var(--sh)}
[data-theme="dark"] .navbtn.act{background:#f1f2f6;color:#14161d}
.navbtn .ic{font-size:18px;width:24px;text-align:center}
#side .spacer{flex:1}
.sidecard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--soft);font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 26px;background:var(--bg);border-bottom:2px solid var(--line)}
#top h1{font-family:var(--fd);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;background:var(--card);white-space:nowrap;box-shadow:0 3px 0 var(--sh)}
.chip.gold{background:#ffe9bd}.chip.fire{background:#ffd9d0}.chip.lvl{background:#d8e6ff}
[data-theme="dark"] .chip.gold{background:#4a3a10}[data-theme="dark"] .chip.fire{background:#4a221b}[data-theme="dark"] .chip.lvl{background:#1d3055}
.icobtn{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:17px;box-shadow:0 3px 0 var(--sh);transition:.15s}
.icobtn:hover{transform:translateY(-2px)}
#view{padding:22px 26px 90px;max-width:1080px;width:100%;margin:0 auto;animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--sh);padding:20px;position:relative;overflow:hidden}
.card.pad-s{padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:12px 20px;font-weight:800;font-size:15px;background:var(--card);box-shadow:0 4px 0 var(--sh);transition:.14s;user-select:none;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.btn.big{padding:15px 26px;font-size:17px;border-radius:16px}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.gold{background:var(--gold);color:#23262f}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--mut);color:var(--mut)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.tag-f.act{background:var(--ink);color:var(--card)}
[data-theme="dark"] .tag-f.act{background:#f1f2f6;color:#14161d}
.bar{height:16px;border:2px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--teal));position:relative;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:sheen 2.6s infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar.thin{height:9px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat-tile{border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--sh);padding:14px 16px}
.stat-tile .n{font-family:var(--fd);font-size:22px;font-weight:900;overflow-wrap:anywhere}
.stat-tile .l{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.tag{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;background:var(--soft)}
.inp{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 15px;font-size:15px;background:var(--card);outline:none;font-weight:600}
.inp:focus{box-shadow:0 0 0 3px rgba(47,111,224,.35)}
.lbl{font-size:12.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 6px}
h2.sec{font-family:var(--fd);font-size:19px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.mut{color:var(--mut)}
.center{text-align:center}

.audiobox{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.audiobox .a-replay{width:52px;height:52px;font-size:20px}
.avol{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--soft)}
.avol input{width:90px}
.aprog{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;font-weight:700;margin:12px 0;border:2px dashed var(--mut);border-radius:12px;padding:10px 12px}

.stage{border:2px solid var(--line);border-radius:18px;background:var(--card);box-shadow:5px 5px 0 var(--sh);margin-bottom:16px;overflow:hidden}
.stage .hd{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;color:#fff;user-select:none}
.stage .hd .em{font-size:26px}
.stage .hd .tt{flex:1;min-width:0}
.stage .hd b{font-family:var(--fd);font-size:15px;display:block}
.stage .hd small{opacity:.85;font-weight:600;font-size:12px}
.stage .hd .pct{font-weight:900;font-size:14px;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 11px}
.stage .body{display:none;padding:16px}
.stage.open .body{display:block;animation:vin .3s}
.stage .chev{transition:.3s;font-size:15px}
.stage.open .chev{transform:rotate(180deg)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:9px}
.lnode{aspect-ratio:1;border-radius:13px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--soft);transition:.15s;position:relative;padding:0}
.lnode.done{background:var(--green);color:#fff}
.lnode.cur{background:var(--gold);color:#23262f;animation:pulse 1.6s infinite}
.lnode.avail{background:var(--card)}
.lnode.avail:hover{transform:translateY(-3px);box-shadow:0 4px 0 var(--sh)}
.lnode.lock{opacity:.45;cursor:not-allowed;border-style:dashed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(237,164,21,.55)}50%{box-shadow:0 0 0 9px transparent}}

#lesson-wrap{max-width:760px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lhead .x{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:16px;box-shadow:0 3px 0 var(--sh);flex-shrink:0}
.lsec{font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.qcard{border:2px solid var(--line);border-radius:20px;background:var(--card);box-shadow:6px 6px 0 var(--sh);padding:26px;animation:vin .3s}
.qtitle{font-family:var(--fd);font-size:18px;margin-bottom:6px}
.qword{font-family:'Noto Sans KR';font-weight:900;font-size:clamp(30px,6vw,46px);margin:12px 0 2px}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.cols2{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);font-weight:700;font-size:15.5px;text-align:left;transition:.14s;box-shadow:0 3px 0 var(--sh);display:flex;gap:10px;align-items:center;min-height:52px;overflow-wrap:anywhere}
.opt:hover{transform:translateY(-2px);background:var(--soft)}
.opt.sel{background:#dceaff;border-color:var(--blue)}
.opt.right{background:var(--green)!important;color:#fff;animation:pop .35s}
.opt.wrong{background:var(--red)!important;color:#fff;animation:shake .4s}
.opt.krb{font-family:'Noto Sans KR';font-weight:700}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;border-top:3px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));animation:up .25s ease}
.fb.ok{background:#d9f2e3;color:#113b24}.fb.no{background:#fde0dc;color:#4a1410}
[data-theme="dark"] .fb.ok{background:#12351f;color:#c9f5da}[data-theme="dark"] .fb.no{background:#3d1512;color:#ffd3cc}
.fb .in{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb .msg{flex:1;min-width:220px}
.fb b{font-size:17px}
@keyframes up{from{transform:translateY(100%)}}
.tokens{display:flex;flex-wrap:wrap;gap:9px;min-height:58px;border-bottom:2px dashed var(--mut);padding:10px 2px;margin:14px 0}
.tokens .tk,.bank .tk{border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--card);font-family:'Noto Sans KR';font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--sh);animation:pop .2s}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.tk:hover{transform:translateY(-2px)}
.speakbtn{width:64px;height:64px;border-radius:18px;border:2px solid var(--line);background:var(--blue);color:#fff;font-size:26px;box-shadow:0 4px 0 var(--sh)}
.speakbtn:active{transform:translateY(3px)}
.xpfly{position:fixed;z-index:99;font-weight:900;color:var(--gold);font-size:19px;text-shadow:1px 1px 0 var(--line);pointer-events:none;animation:fly 1.1s ease forwards;font-family:var(--fd)}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.combo{color:var(--orange);font-weight:900;font-size:13px;white-space:nowrap}
.conf{position:fixed;top:-14px;width:10px;height:16px;z-index:98;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(106vh) rotate(720deg)}}
.ainp-ok{border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(31,158,87,.3)!important}
.ainp-no{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(225,75,59,.3)!important}

.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
.acard{width:100%;max-width:480px;border:2px solid var(--line);border-radius:24px;background:var(--card);box-shadow:8px 8px 0 var(--sh);padding:34px 30px;animation:vin .4s}
.acard .big{font-family:'Noto Sans KR';font-weight:900;font-size:36px}
.alogo{width:74px;height:74px;border-radius:22px;background:var(--red);display:grid;place-items:center;color:#fff;font-family:'Noto Sans KR';font-weight:900;font-size:36px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--sh);transform:rotate(-5deg);margin:0 auto 18px;animation:wob 3.5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg) translateY(-5px)}}
.lvbtn{width:100%;text-align:left;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--sh);padding:15px 17px;margin-bottom:12px;transition:.15s;display:flex;gap:13px;align-items:center}
.lvbtn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.lvbtn .em{font-size:29px}
.lvbtn b{font-family:var(--fd);font-size:14px;display:block}
.lvbtn small{color:var(--mut);font-weight:600}
.notice{border:2px dashed var(--mut);border-radius:13px;padding:10px 13px;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:14px}
.err{color:var(--red);font-weight:700;font-size:13.5px;margin-top:9px;min-height:17px}

#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
#bnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--mut);padding:5px 2px;border-radius:12px}
#bnav button.act{color:var(--ink);background:var(--soft)}
#bnav .ic{font-size:20px}
body.in-lesson #bnav{display:none!important}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%}
.toast{border:2px solid var(--line);background:var(--ink);color:var(--card);border-radius:14px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--sh);animation:tin .3s;max-width:92vw}
[data-theme="dark"] .toast{background:#f1f2f6;color:#14161d}
@keyframes tin{from{transform:translateY(-24px);opacity:0}}
.wrow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:11px 14px;margin-bottom:9px;transition:.15s;flex-wrap:wrap}
.wrow:hover{transform:translateX(4px)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.dot.g{background:var(--green)}.dot.y{background:var(--gold)}.dot.r{background:var(--red)}
.achcard{border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--sh);padding:16px;text-align:center;transition:.2s}
.achcard .em{font-size:34px}
.achcard.lock{opacity:.45;filter:grayscale(1)}
.achcard:not(.lock):hover{transform:translateY(-4px) rotate(-1deg)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:2px solid var(--soft);flex-wrap:wrap}
.sw{width:52px;height:30px;border-radius:999px;border:2px solid var(--line);background:var(--soft);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--line);transition:.2s}
.sw.on{background:var(--green)}
.sw.on::after{left:24px}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--card)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-family:var(--fd);font-size:20px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}
.chart i{flex:1;background:linear-gradient(180deg,var(--gold),var(--orange));border:2px solid var(--line);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.chart i:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:var(--ink);color:var(--card);border-radius:6px;padding:2px 6px;white-space:nowrap}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;font-weight:700}
.tbar .bar{flex:1}
.tbar span:first-child{width:110px;flex-shrink:0}
.avatar{width:86px;height:86px;border-radius:26px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--sh);display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:36px;color:#fff;transform:rotate(-3deg);flex-shrink:0}
.finale{font-family:var(--fd)}
.finale .huge{font-size:clamp(24px,5vw,40px);font-weight:900;line-height:1.15}

/* ---------- AI помощник ---------- */
#ai-fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:70;width:58px;height:58px;border-radius:20px;border:2px solid var(--line);background:var(--pink);color:#fff;font-size:26px;box-shadow:0 5px 0 var(--sh);transition:.15s}
#ai-fab:hover{transform:translateY(-3px) rotate(-4deg)}
@media(max-width:920px){#ai-fab{bottom:calc(78px + env(safe-area-inset-bottom))}}
body.in-lesson #ai-fab{display:none}
#ai-panel{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;width:min(440px,calc(100vw - 24px));max-height:min(72vh,640px);display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:8px 8px 0 var(--sh);overflow:hidden;animation:vin .25s}
@media(max-width:920px){#ai-panel{right:12px;left:12px;bottom:calc(72px + env(safe-area-inset-bottom));width:auto}}
.ai-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pink);color:#fff;border-bottom:2px solid var(--line)}
.ai-hd .icobtn{width:32px;height:32px;font-size:14px;background:rgba(255,255,255,.22);border-color:rgba(0,0,0,.4);box-shadow:none;color:#fff}
#ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:180px;background:var(--bg)}
.ai-msg{max-width:88%;padding:10px 13px;border-radius:14px;border:2px solid var(--line);font-size:14px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.ai-msg.user{align-self:flex-end;background:#dceaff;border-color:var(--blue)}
.ai-msg.bot{align-self:flex-start;background:var(--card)}
[data-theme="dark"] .ai-msg.user{background:#1d3055;color:#eaf1ff}
.ai-note{font-size:13px;color:var(--mut);font-weight:600;border:2px dashed var(--mut);border-radius:12px;padding:10px}
.ai-typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:4px;animation:bl 1s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:2px solid var(--soft)}
.ai-chip{border:2px solid var(--line);border-radius:999px;background:var(--soft);font-size:11.5px;font-weight:700;padding:5px 10px}
.ai-chip:hover{background:var(--card);transform:translateY(-1px)}
.ai-in{display:flex;gap:8px;padding:10px 12px;border-top:2px solid var(--line)}
.ai-in .btn{padding:10px 16px}
.ai-in .inp{flex:1;padding:10px 13px}

@media(max-width:920px){
  #side{display:none}
  #bnav{display:flex}

/* ---------- план 1000 уроков ---------- */
const PLANS=[null], IL={};
(function buildAllPlans(){
  let wC=0,pC=0,gC=0;
  for(let n=1;n<=1000;n++){
    let type,newItems=[];
    if(n<=4){type='hangul';}
    else if(n%9===0)type='review';
    else if(n%13===0)type='listen';
    else if(n>=15&&n%7===0)type='grammar';
    else type='vocab';
    if(type==='vocab'){
      let k=n<=600?4:5;
      while(k>0&&wC<W.length){newItems.push({t:'w',i:wC});wC++;k--;}
      if(!newItems.length){let k2=2;while(k2>0&&pC<PH.length){newItems.push({t:'p',i:pC});pC++;k2--;}}
    }else if(type==='listen'){
      if(pC<PH.length){newItems.push({t:'p',i:pC});pC++;}
    }else if(type==='grammar'){
      if(gC<G.length){newItems.push({t:'g',i:gC});gC++;}
    }
    newItems.forEach(it=>IL[it.t+it.i]=n);
    PLANS.push({n,type,newItems});
  }
})();
function itemGet(r){return r.t==='w'?W[r.i]:r.t==='p'?PH[r.i]:G[r.i]}
function itemCat(r){return r.t==='w'?(W[r.i].f==='v'?'act':W[r.i].f==='a'?'qal':W[r.i].c):r.t==='p'?'phr':'gra'}
function lessonTitle(n){
  const p=PLANS[n];
  if(p.type==='hangul')return HANGUL_TITLES[n-1];
  const s=stageOf(n),topics=TOP[STG.indexOf(s)];
  const topic=topics[Math.floor((n-s.a)/5)%topics.length];
  if(p.type==='review')return 'Повторение · '+topic;
  if(p.type==='listen')return 'Аудирование · '+topic;
  if(p.type==='grammar'&&p.newItems[0])return 'Грамматика · '+G[p.newItems[0].i][0];
  if(!p.newItems.length)return 'Повторение · '+topic;
  return topic+' · ч.'+(Math.floor((n-s.a)/(5*topics.length))+1);
}

/* ---------- АУДИО: Web Speech API ---------- */
let VOICES=[], VOICE_MISSING_SHOWN={};
function refreshVoices(){
  if(!('speechSynthesis' in window))return;
  try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}
}
if('speechSynthesis' in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;}
function pickVoiceFor(lang){
  if(!VOICES.length)refreshVoices();
  const exact=VOICES.filter(v=>v.lang===lang);
  if(exact.length)return exact[0];
  const base=String(lang).split('-')[0];
  const near=VOICES.filter(v=>v.lang&&String(v.lang).toLowerCase().startsWith(base.toLowerCase()));
  if(near.length)return near[0];
  return null;
}
function hasVoice(lang){return !!pickVoiceFor(lang)}
function speak(text,lang,rate){
  lang=lang||'ko-KR';
  if(!text)return false;
  if(!('speechSynthesis' in window)){toast('Браузер не поддерживает озвучку речи','⚠️');return false;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    const v=pickVoiceFor(lang);
    if(v)u.voice=v;
    else if(!VOICE_MISSING_SHOWN[lang]){VOICE_MISSING_SHOWN[lang]=1;
      toast('Голос '+lang+' не найден в системе — использую ближайший доступный','ℹ️');}
    u.rate=rate||(S&&S.set.rate)||0.9;
    u.volume=(S&&typeof S.set.vol==='number')?S.set.vol:1;
    u.onerror=function(){toast('Не удалось воспроизвести звук','⚠️');};
    speechSynthesis.speak(u);
    return true;
  }catch(e){toast('Ошибка воспроизведения звука','⚠️');return false;}
}
function speakKorean(text){return speak(text,'ko-KR')}
function playTaskAudio(t){

}

async function hashPass(p,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'::'+p));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;const s=salt+'::'+p;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);}
}

/* ---------- короткие сигналы ---------- */
let actx=null;
function ensureAC(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,d,type,t0,vol){type=type||'sine';t0=t0||0;vol=vol||.12;
  if(!S||!S.set.sound)return;if(!ensureAC())return;
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+t0;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.05);}
function sfx(k){if(!S||!S.set.sound)return;
  if(k==='ok'){tone(660,.12);tone(880,.16,'sine',.09);}
  else if(k==='bad'){tone(190,.22,'square',0,.07);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',i*.11));}
  else if(k==='click'){tone(500,.05,'triangle',0,.05);}
}

const LVN=[['새싹','Росток'],['초보자','Новичок'],['학습자','Ученик'],['도전자','Претендент'],['탐험가','Исследователь'],['실천가','Практик'],['전문가','Специалист'],['달인','Умелец'],['명수','Знаток'],['스승','Наставник'],['거장','Мэтр'],['한국어 마스터','Мастер корейского']];
function levelInfo(xp){let n=1;while(n<60&&40*(n+1)*(n+1)+80*(n+1)<=xp)n++;
  const cur=40*n*n+80*n,next=40*(n+1)*(n+1)+80*(n+1);
  return {n,name:LVN[Math.min(n-1,11)],cur,next,pct:Math.max(0,Math.min(100,Math.round(100*(xp-cur)/(next-cur))))};}
function addXP(n,quiet){if(!S||n<=0)return;S.xp+=n;const t=todayStr();S.st.xpH[t]=(S.st.xpH[t]||0)+n;
  if(!quiet)floatXP(n);updateTop();}
function updateStreak(){if(!S)return;const t=todayStr();if(S.lastDay===t)return;
  const gap=S.lastDay?daysBetween(S.lastDay,t):1;
  if(gap===1){S.streak++;}
  else if(gap===2&&S.freezes>0){S.freezes--;S.streak++;toast('Заморозка серии спасла твой огонь! ❄️→🔥');}
  else S.streak=1;
  S.lastDay=t;S.best=Math.max(S.best,S.streak);
  if(S.streak%7===0&&S.freezes<2){S.freezes++;toast('Награда за серию: заморозка ❄️ (+1)','🎁');}
  saveProgress();updateTop();}
function learnedWords(){if(!S)return 0;return Object.keys(S.words).filter(i=>S.words[i].s).length}
function accGlobal(){return S.st.ans?Math.round(100*S.st.ok/S.st.ans):100}
function dueWords(){const now=Date.now(),r=[];for(const i in S.words){const w=S.words[i];if(w.s&&w.due<=now)r.push(+i)}return r}
function mistakeWords(){const r=[];for(const i in S.words){const w=S.words[i];if(w.bad>=2)r.push(+i)}return r}
function recordAnswer(ref,ok){if(!S||!ref)return;
  S.st.ans++;if(ok)S.st.ok++;else S.st.miss++;
  const c=itemCat(ref);S.st.cat[c]=S.st.cat[c]||{ok:0,bad:0};S.st.cat[c][ok?'ok':'bad']++;
  if(ref.t==='w'){const i=ref.i;S.words[i]=S.words[i]||{s:0,ok:0,bad:0,box:0,due:0};const w=S.words[i];w.s=1;
    if(ok){w.ok++;w.box=Math.min(5,w.box+1);w.due=Date.now()+[0,1,3,7,14,30][w.box]*864e5;}
    else{w.bad++;w.box=Math.max(0,w.box-1);w.due=Date.now()+10*60e3;}}
  updateStreak();}

async function callOpenAI(cfg,msgs){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),40000);
  let r;
  try{
    r=await fetch(cfg.url,{method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model,messages:msgs,temperature:0.6})});
  }finally{clearTimeout(to);}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!t)throw new Error('Пустой ответ модели');
  return String(t).trim();}
async function callGemini(cfg,msgs){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(cfg.model)+':generateContent?key='+encodeURIComponent(cfg.key);
  const sys=msgs.find(m=>m.role==='system');
  const rest=msgs.filter(m=>m.role!=='system');
  const contents=rest.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const body={contents};
  if(sys)body.systemInstruction={parts:[{text:sys.content}]};
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),40000);
  let r;
  try{
    r=await fetch(url,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }finally{clearTimeout(to);}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  const c=j.candidates&&j.candidates[0];
  const t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';
  if(!t)throw new Error('Пустой ответ модели');
  return String(t).trim();}

  S.aiHist.push({role:'user',content:q});renderAIMsgs();
  const tb=typingBubble();$('#ai-send').disabled=true;

  }catch(e){

    if(String(e.message).indexOf('HTTP 401')!==-1)m='⚠️ Неверный API-ключ (401). Проверь его в настройках.';
    else if(String(e.message).indexOf('HTTP 429')!==-1)m='⚠️ Превышен лимит запросов (429). Попробуй чуть позже.';
    else if(String(e.message).indexOf('abort')!==-1)m='⚠️ Модель не ответила вовремя. Попробуй ещё раз.';
    else if(String(e.message)==='Failed to fetch')m='⚠️ Не удалось соединиться с API. Проверь интернет и адрес endpoint в настройках.';
    S.aiHist.push({role:'assistant',content:m});}
  removeTyping(tb);$('#ai-send').disabled=false;renderAIMsgs();saveProgress();}

let AUDIO_BANK=null;
function buildAudioBank(){
  const bank=audioQuestions.map((q,i)=>Object.assign({key:'custom'+i},q));
  W.forEach((w,i)=>{
    if(w.f==='v'||w.f==='a')return;
    bank.push({type:'listen-choice',key:'c'+i,word:w.k,translation:w.ru,rom:w.r,audioText:w.k,lang:'ko-KR',src:'w'});
    bank.push({type:'listen-translate',key:'ct'+i,word:w.k,translation:w.ru,rom:w.r,audioText:w.k,lang:'ko-KR',src:'w'});
    bank.push({type:'listen-tf',key:'t'+i,word:w.k,translation:w.ru,rom:w.r,audioText:w.k,lang:'ko-KR',src:'w'});
    if(w.k.length<=4)bank.push({type:'listen-write',key:'cw'+i,word:w.k,rom:w.r,translation:w.ru,audioText:w.k,lang:'ko-KR',src:'w'});
  });
  PH.forEach((p,i)=>{
    bank.push({type:'listen-phrase-translate',key:'p'+i,word:p[0],translation:p[2],rom:p[1],audioText:p[0],lang:'ko-KR',src:'p'});
    if(p[0].split(' ').length>=2)bank.push({type:'listen-build',key:'b'+i,word:p[0],translation:p[2],rom:p[1],audioText:p[0],lang:'ko-KR',src:'p'});
  });
  return bank;

function audioBank(){if(!AUDIO_BANK)AUDIO_BANK=buildAudioBank();return AUDIO_BANK}
const RECENT_LIMIT=8;
let recentQuestions=[];
function qKey(q){return q.type+':'+q.key}
function getRandomQuestion(filter){
  const bank=audioBank().filter(q=>!filter||filter(q));
  if(!bank.length)return null;
  let pool=bank.filter(q=>recentQuestions.indexOf(qKey(q))===-1);
  if(!pool.length){recentQuestions=[];pool=bank;}
  const q=pool[Math.floor(Math.random()*pool.length)];
  recentQuestions.push(qKey(q));
  if(recentQuestions.length>RECENT_LIMIT)recentQuestions.shift();
  return q;
}
function distrRu(q,n,rng){const out=[],seen={};seen[q.translation]=1;
  const pool=q.src==='p'?PH.map(p=>p[2]):W.filter(w=>w.f==='').map(w=>w.ru);
  let g=0;while(out.length<n&&g++<300){const x=pool[Math.floor(rng()*pool.length)];if(!seen[x]){seen[x]=1;out.push(x);}}
  return out;}
function distrKr(q,n,rng){const out=[],seen={};seen[q.word]=1;
  const pool=q.src==='p'?PH.map(p=>p[0]):W.filter(w=>w.f==='').map(w=>w.k);
  let g=0;while(out.length<n&&g++<300){const x=pool[Math.floor(rng()*pool.length)];if(!seen[x]){seen[x]=1;out.push(x);}}
  return out;}
function audioQuestionToTask(q,rng){
  rng=rng||Math.random;
  const base={audio:{text:q.audioText,lang:q.lang||'ko-KR'},aq:q};
  if(q.options&&q.options.length){
    const idx=q.correct||0;
    const pairs=q.options.map((o,i)=>({o:o,ok:i===idx}));
    const sp=shuf(rng,pairs);
    return Object.assign({kind:'listen',q:'Прослушай и выбери правильный вариант',opts:sp.map(x=>x.o),ans:q.options[idx],
      note:q.word+' — '+q.translation},base);
  }
  if(q.type==='listen-choice'){
    const dis=distrKr(q,3,rng);
    return Object.assign({kind:'listen',q:'🔊 Прослушай и выбери слово, которое прозвучало',
      opts:shuf(rng,[q.word].concat(dis)),ans:q.word,kr:true,hint:q.rom||'',
      note:'Прозвучало: '+q.word+(q.rom?' ['+q.rom+']':'')+' — '+q.translation},base);
  }
  if(q.type==='listen-translate'){
    const dis=distrRu(q,3,rng);
    return Object.assign({kind:'listen',q:'🔊 Прослушай и выбери перевод',
      opts:shuf(rng,[q.translation].concat(dis)),ans:q.translation,hint:q.rom||'',
      note:'«'+q.word+'» = '+q.translation},base);
  }
  if(q.type==='listen-phrase-translate'){
    const dis=distrRu(q,3,rng);
    return Object.assign({kind:'listen',q:'🔊 Прослушай фразу и выбери перевод',
      opts:shuf(rng,[q.translation].concat(dis)),ans:q.translation,hint:q.rom||'',
      note:'«'+q.word+'» = '+q.translation},base);
  }
  if(q.type==='listen-write'){
    const acc=[String(q.word).toLowerCase()];
    if(q.rom)acc.push(String(q.rom).toLowerCase());
    return Object.assign({kind:'write',q:'🔊 Прослушай и напиши услышанное слово',
      ans:q.word,ansArr:acc,hint:q.rom||'',
      note:'Правильно: '+q.word+(q.rom?' ['+q.rom+']':'')+' — '+q.translation},base);
  }
  if(q.type==='listen-build'){
    const tokens=String(q.word).split(' ');
    return Object.assign({kind:'build',q:'🔊 Прослушай и собери фразу по порядку',
      hint:q.translation,tokens:tokens,bank:shuf(rng,tokens.slice()),ans:tokens,
      note:'Правильно: '+q.word+' — '+q.translation},base);
  }
  if(q.type==='listen-tf'){
    const isTrue=rng()<.5;let t2=q.translation;
    if(!isTrue){const alt=distrRu(q,1,rng)[0];if(alt)t2=alt;}
    return Object.assign({kind:'tf',q:'🔊 Прослушай. Правда или ложь?',
      stmt:q.word+' — это «'+t2+'»',ans:(t2===q.translation),
      note:'«'+q.word+'» = '+q.translation},base);
  }
  return Object.assign({kind:'listen',q:'Прослушай',opts:[q.translation],ans:q.translation},base);
}
function itemToQ(it){
  if(it.t==='w'){const w=W[it.i];return {type:'listen-choice',key:'w'+it.i,word:w.k,translation:w.ru,rom:w.r,audioText:w.k,lang:'ko-KR',src:'w'};}
  const p=PH[it.i];return {type:'listen-phrase-translate',key:'p'+it.i,word:p[0],translation:p[2],rom:p[1],audioText:p[0],lang:'ko-KR',src:'p'};
}

/* ---------- генератор заданий урока ---------- */
function romShown(n){if(!S)return true;return S.set.rom==='on'||(S.set.rom==='auto'&&n<=40)}
function optCount(n){return n>750?4:3}
function distractors(ref,rng,k){
  const res=[],seen={};
  if(ref.t==='w'){const w=W[ref.i];
    for(let i=0;i<W.length;i++){if(i===ref.i)continue;const c=W[i];
      if((c.f===w.f&&w.f!=='')||c.c===w.c){res.push({t:'w',i});seen[i]=1;if(res.length>=k*3)break;}}}
  else if(ref.t==='p'){for(let i=0;i<PH.length;i++){if(i!==ref.i&&Math.abs(PH[i][3]-itemGet(ref)[3])<=1){res.push({t:'p',i});if(res.length>=k*3)break;}}}
  else{for(let i=0;i<G.length;i++){if(i!==ref.i)res.push({t:'g',i});if(res.length>=k*3)break;}}
  let g=0;while(res.length<k&&g<400){const i=Math.floor(rng()*W.length);if(!seen[i]){seen[i]=1;res.push({t:'w',i});}g++;}
  return shuf(rng,res).slice(0,k);}
function pickItem(rng,pool){
  let tot=0;const ws=pool.map(r=>{let w=1;if(r.t==='w'&&S&&S.words[r.i]){const d=S.words[r.i];if(d.bad>0)w+=3*d.bad/(d.ok+d.bad);}tot+=w;return w;});
  let x=rng()*tot;for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i];}return pool[pool.length-1];}
function pastItems(n,rng,k){
  const out=[],seen={};
  for(let m=Math.max(1,n-30);m<n;m++){for(const r of PLANS[m].newItems){if(!seen[r.t+r.i]){seen[r.t+r.i]=1;out.push(r);}}}
  if(S){for(const i of mistakeWords()){const key='w'+i;if(!seen[key]&&out.length<60){seen[key]=1;out.push({t:'w',i});}}}
  return shuf(rng,out).slice(0,k);}
function genExample(w){
  if(w.f==='v'){const base=CM[w.k]||'';return ['저는 '+base+w.yo,'Пример с «'+w.ru.toLowerCase()+'»'];}
  if(w.f==='a')return [w.yo+'!','«'+w.ru.toLowerCase()+'»'];
  if(w.f==='e')return [w.k+part(w.k,'sub')+' 맛있어요','«'+w.ru+'» — вкусный'];
  if(w.f==='d')return [w.k+part(w.k,'obj')+' 마셔요','Я пью «'+w.ru.toLowerCase()+'»'];
  if(w.f==='p')return [w.k+part(w.k,'loc')+' 가고 싶어요','Хочу поехать: «'+w.ru+'»'];
  if(w.f==='h')return [w.k+part(w.k,'obj')+' 만났어요','Я встретил: «'+w.ru+'»'];
  if(w.f==='t')return [w.k+' 뭐 해요?','Что делаешь ('+w.ru.toLowerCase()+')?'];
  return ['저는 '+w.k+part(w.k,'obj')+' 좋아해요','Мне нравится: «'+w.ru.toLowerCase()+'»'];}
const CM={'가다':'학교에 ','오다':'집에 ','먹다':'밥을 ','마시다':'물을 ','보다':'영화를 ','읽다':'책을 ','쓰다':'편지를 ','듣다':'음악을 ','배우다':'한국어를 ','사다':'선물을 ','만나다':'친구를 ','타다':'버스를 '};
function buildSentenceFor(it){
  if(it.t==='p')return [PH[it.i][0],PH[it.i][2]];
  const w=W[it.i];
  if(w.f==='v'){if(CM[w.k])return [CM[w.k]+w.yo,'Пример с глаголом «'+w.ru.toLowerCase()+'»'];return ['저는 매일 '+w.yo,'Каждый день: «'+w.ru.toLowerCase()+'»'];}
  if(w.f==='a'){const subj={'좋다':'기분이','크다':'집이','작다':'방이','어렵다':'한국어가','맛있다':'음식이','예쁘다':'꽃이','비싸다':'가방이','재미있다':'영화가','덥다':'여름이','춥다':'겨울이','빠르다':'기차가','중요하다':'건강이','조용하다':'도서관이','위험하다':'밤길이'}[w.k];
    return subj?[subj+' '+w.yo,'Пример с «'+w.ru.toLowerCase()+'»']:null;}
  if(w.f==='e')return [w.k+part(w.k,'sub')+' 맛있어요','«'+w.ru+'» — вкусно'];
  if(w.f==='d')return ['저는 '+w.k+part(w.k,'obj')+' 마셔요','Я пью: '+w.ru.toLowerCase()];
  if(w.f==='p')return [w.k+part(w.k,'loc')+' 가고 싶어요','Хочу поехать: '+w.ru.toLowerCase()];
  if(w.f==='h')return [w.k+part(w.k,'obj')+' 만났어요','Я встретил: '+w.ru.toLowerCase()];
  if(w.f==='t')return [w.k+' 뭐 해요?','Что делаешь ('+w.ru.toLowerCase()+')?'];
  return ['저는 '+w.k+part(w.k,'obj')+' 좋아해요','Мне нравится: '+w.ru.toLowerCase()];}
function tChoice(it,rng,plan){
  const n=(plan&&plan.n)||300;
  if(it.t==='g'){const g=G[it.i];const dis=shuf(rng,G.filter((x,i)=>i!==it.i).map(x=>x[1])).slice(0,optCount(n));
    return {kind:'choice',q:'Что выражает конструкция «'+g[0]+'»?',opts:shuf(rng,[g[1]].concat(dis)),ans:g[1],ref:it,alwaysNote:true,
      note:g[0]+' — '+g[1]+'. Пример: '+g[3]+' — '+g[5]+'.'};}
  const it2=itemGet(it);
  if(it.t==='p'){const dis=distractors(it,rng,optCount(n)).map(d=>itemGet(d)[2]);
    return {kind:'choice',q:'Что означает фраза:',kw:it2[0],rom:romShown(n)?it2[1]:'',opts:shuf(rng,[it2[2]].concat(dis)),ans:it2[2],ref:it,note:'«'+it2[0]+'» = '+it2[2]};}
  const w=W[it.i],dis=distractors(it,rng,optCount(n)).map(d=>W[d.i].ru);
  return {kind:'choice',q:'Что означает:',kw:w.k,rom:romShown(IL['w'+it.i]||50)?w.r:'',opts:shuf(rng,[w.ru].concat(dis)),ans:w.ru,ref:it,note:'«'+w.k+'» ['+w.r+'] = '+w.ru};}
function tReverse(it,rng,plan){
  const n=(plan&&plan.n)||300;
  if(it.t==='p'){const w=PH[it.i];const dis=distractors(it,rng,optCount(n)).map(d=>itemGet(d)[0]);
    return {kind:'choice',q:'Как по-корейски: «'+w[2]+'»?',opts:shuf(rng,[w[0]].concat(dis)),ans:w[0],ref:it,kr:true,note:w[0]+' = '+w[2]};}
  const w=W[it.i];const dis=distractors(it,rng,optCount(n)).map(d=>W[d.i].k);
  return {kind:'choice',q:'Как будет «'+w.ru.toLowerCase()+'»?',opts:shuf(rng,[w.k].concat(dis)),ans:w.k,ref:it,kr:true,note:w.k+' ['+w.r+'] = '+w.ru};}
function tTF(it,rng){
  const w=itemGet(it);let stmt,ans;
  if(it.t==='g'){const ok=rng()<.5;let m2=w[1];
    if(!ok){m2=G[(it.i+1+Math.floor(rng()*(G.length-2)))%G.length][1];if(m2===w[1])m2=G[(it.i+7)%G.length][1];}
    stmt='«'+w[0]+'» означает: «'+m2+'»';ans=(m2===w[1]);}
  else{const ru=it.t==='p'?w[2]:w.ru,k=it.t==='p'?w[0]:w.k;const ok=rng()<.5;let ru2=ru;
    if(!ok){if(it.t==='p'){ru2=PH[(it.i+1+Math.floor(rng()*(PH.length-2)))%PH.length][2];if(ru2===ru)ru2=PH[(it.i+7)%PH.length][2];}
      else{ru2=W[(it.i+1+Math.floor(rng()*(W.length-2)))%W.length].ru;if(ru2===ru)ru2=W[(it.i+13)%W.length].ru;}}
    ans=(ru===ru2);stmt=k+' — это «'+ru2+'»';}
  return {kind:'tf',q:'Правда или ложь?',stmt,ans,ref:it,
    note:'Правильное значение: '+(it.t==='p'?w[0]+' = '+w[2]:it.t==='g'?w[0]+' — '+w[1]:w.k+' = '+w.ru)};}
function tListen(it,rng,plan){
  const n=(plan&&plan.n)||300;
  const q=itemToQ(it);
  const roll=rng();
  if(it.t==='w'&&n>=120&&roll<0.22&&W[it.i].k.length<=4)q.type='listen-write';
  else if(it.t==='p'&&n>=150&&roll<0.45)q.type='listen-build';
  else if(n>=140&&roll<0.62)q.type='listen-translate';
  else if(n>=200&&roll<0.8)q.type='listen-tf';
  else q.type='listen-choice';
  const t=audioQuestionToTask(q,rng);
  t.ref=it;return t;}
function tGap(it,rng){
  const w=W[it.i];if(w.f==='v')return tConj(it,rng);if(w.f==='a')return tChoice(it,rng);
  let kinds;
  if(w.f==='p')kinds=['loc','obj','top'];
  else if(w.f==='h')kinds=['obj','gen','sub'];
  else kinds=['obj','sub','top'];
  const kk=kinds[Math.floor(rng()*kinds.length)];
  const ans=part(w.k,kk);
  const pool=['top','sub','obj','loc','gen','also','only'].filter(x=>x!==kk&&!(x==='loc'&&w.f!=='p'));
  const opts=shuf(rng,[ans].concat(shuf(rng,pool).slice(0,3).map(p=>part(w.k,p))));
  const verbMap={obj:(w.f==='e'?' 먹어요':w.f==='d'?' 마셔요':' 좋아해요'),sub:' 있어요',top:' 어때요?',loc:' 가요',gen:' 이름이 뭐예요?'};
  const explMap={obj:'을/를 — частица объекта (что? кого?)',sub:'이/가 — частица подлежащего (кто? что?)',top:'은/는 — частица темы',loc:'에 — направление/место «в, на»',gen:'의 — притяжательная частица «-ин, -ов»'};
  const sent=(kk==='gen'?'저는 '+w.k+'___':w.k+'___'+(verbMap[kk]||' 있어요'));
  return {kind:'gap',q:'Выбери правильную частицу',sent,opts,ans,ref:it,alwaysNote:true,
    note:explMap[kk]+'. После «'+w.k+'» (падчим: '+(batchim(w.k)?'есть':'нет')+') → '+ans+'.'};}
function tConj(it,rng){
  const w=W[it.i];if(w.f!=='v')return tChoice(it,rng);
  const fut=w.k.slice(0,-1)+'겠어요';
  const tenses=[['past','어제','Вчера',w.pa],['pres','매일','Каждый день',w.yo],['fut','내일','Завтра',fut]];
  const t=tenses[Math.floor(rng()*tenses.length)];
  const opts=shuf(rng,[w.yo,w.fm,w.pa,fut]);
  const obj=CM[w.k]||'';
  return {kind:'gap',q:'Выбери правильную форму глагола ('+t[1]+' — '+t[2]+')',
    sent:t[2]+' 저는 '+obj+'___',opts,ans:t[3],ref:it,alwaysNote:true,
    note:w.k+' («'+w.ru.toLowerCase()+'»): настоящее '+w.yo+', вежливая форма '+w.fm+', прошедшее '+w.pa+', будущее/предположение '+fut+'.'};}
function tBuild(it,rng,plan){
  const n=(plan&&plan.n)||300;
  const s=buildSentenceFor(it);if(!s)return tChoice(it,rng,plan);
  const tokens=s[0].split(' ');
  const decoys=[];
  if(n>500&&tokens.length>2){
    const other={t:'w',i:Math.floor(rng()*W.length)};
    const p2=buildSentenceFor(other);
    if(p2)p2[0].split(' ').forEach(tk=>{if(tokens.indexOf(tk)===-1&&decoys.length<(n>800?2:1)&&rng()<.6)decoys.push(tk);});}
  return {kind:'build',q:'Составь предложение',hint:s[1],tokens,bank:shuf(rng,tokens.concat(decoys)),ans:tokens,ref:it,note:'Правильно: '+s[0]+' — '+s[1]};}
function tGapG(it,rng,plan){const g=G[it.i];const n=(plan&&plan.n)||300;
  const dis=shuf(rng,G.filter((x,i)=>i!==it.i).map(x=>x[3])).slice(0,optCount(n));
  return {kind:'choice',q:'Выбери пример на конструкцию «'+g[0]+'» ('+g[1]+')',
    opts:shuf(rng,[g[3]].concat(dis)),ans:g[3],ref:it,kr:true,alwaysNote:true,note:g[3]+' ['+g[4]+'] — '+g[5]};}
function tCard(it){return {kind:'card',ref:it};}
function mkTask(it,plan,rng){
  const n=plan.n||300,opts=[];
  if(it.t==='g'){opts.push(tChoice,tChoice,tTF);if(n>=60)opts.push(tGapG);return opts[Math.floor(rng()*opts.length)](it,rng,plan);}
  opts.push(tChoice,tTF,tListen);
  if(it.t==='w'){const w=W[it.i];
    opts.push(tReverse);
    if(w.f==='v'){if(n>=60)opts.push(tConj);if(n>=80)opts.push(tBuild);}
    else if(w.f==='a'){if(n>=80)opts.push(tBuild);}
    else{if(n>=30)opts.push(tGap);if(n>=45)opts.push(tBuild);}
  }else{if(n>=40)opts.push(tReverse);if(n>=55)opts.push(tBuild);}
  return opts[Math.floor(rng()*opts.length)](it,rng,plan);}
function generateLesson(plan){
  const rng=rng32(plan.n*7919+13),T=[];
  if(plan.type==='hangul'){
    const chars=HANGUL_LESSONS[plan.n-1];
    const lets=chars.map(c=>LET.find(l=>l[0]===c));
    lets.forEach(l=>T.push({kind:'card',letter:l}));
    for(let i=0;i<6;i++){const l=lets[i%lets.length];
      if(i%2===0){const dis=shuf(rng,LET.filter(x=>x[0]!==l[0]).map(x=>x[1])).slice(0,3);
        T.push({kind:'choice',q:'Как называется буква:',kw:l[0],opts:shuf(rng,[l[1]].concat(dis)),ans:l[1],note:l[0]+' — это '+l[1]+' ['+l[2]+'], звук: '+l[3]});}
      else{const dis=shuf(rng,LET.filter(x=>x[0]!==l[0]).map(x=>x[0])).slice(0,3);
        T.push({kind:'choice',q:'Найди букву «'+l[1]+'» (звук: '+l[3]+')',opts:shuf(rng,[l[0]].concat(dis)),ans:l[0],kr:true,note:l[0]+' — это '+l[1]+' ['+l[2]+']'});}}
    return T;}
  plan.newItems.forEach(it=>T.push(tCard(it)));
  const pool=plan.newItems.concat(pastItems(plan.n,rng,8));
  if(!pool.length)for(let i=0;i<6;i++)pool.push({t:'w',i:Math.floor(rng()*Math.min(60,W.length))});
  const exN=5+Math.min(6,Math.floor(plan.n/150));
  for(let i=0;i<exN;i++){const it=pickItem(rng,pool);const t=mkTask(it,plan,rng);t.ref=it;T.push(t);}
  const finN=4+Math.min(9,Math.floor(plan.n/110));
  for(let i=0;i<finN;i++){const it=pickItem(rng,pool);const t=mkTask(it,plan,rng);t.final=true;t.ref=it;T.push(t);}
  return T;}

const PRAISE=['Отлично!','Верно!','Молодец!','Именно так!','Супер!','대단해요! Впечатляет!','Точно!'];
const ENCOUR=['Ничего страшного! Попробуй ещё раз чуть позже.','Ошибаться — нормально. Слово вернётся в повторении.','Почти! Запомним и повторим.'];
function checkAnswer(val){
  if(!L||L.done)return;const t=L.tasks[L.i];L.done=true;
  let ok;
  if(t.kind==='build')ok=Array.isArray(val)&&val.length===t.ans.length&&val.every((x,i)=>x===t.ans[i]);
  else if(t.kind==='write'){const v=String(val||'').trim().toLowerCase();ok=t.ansArr&&t.ansArr.indexOf(v)!==-1;
    const inp=$('#w-inp');if(inp){inp.disabled=true;inp.classList.add(ok?'ainp-ok':'ainp-no');}}
  else ok=(val===t.ans);
  if(ok){L.ok++;L.combo++;S.st.maxCombo=Math.max(S.st.maxCombo,L.combo);
    let gain=10;if(L.combo>0&&L.combo%3===0)gain+=5;
    L.xp+=gain;addXP(gain);recordAnswer(t.ref,true);sfx('ok');
    t.wasOk=true;
    $$('.opt.sel').forEach(b=>b.classList.add('right'));}
  else{L.bad++;L.combo=0;if(t.final)L.finalAll=false;
    recordAnswer(t.ref,false);sfx('bad');t.wasOk=false;
    $$('.opt.sel').forEach(b=>b.classList.add('wrong'));
    if(t.ref&&!L.retried.has(t.ref.t+t.ref.i)){L.retried.add(t.ref.t+t.ref.i);
      const nt=mkTask(t.ref,L.plan,rng32(Date.now()%1e9));nt.retry=true;nt.ref=t.ref;
      const fi=L.tasks.findIndex(x=>x.final);L.tasks.splice(fi===-1?L.tasks.length:fi,0,nt);}}
  if(L.mode==='audio')recordAudioStats(ok,t);
  showFB(ok,t);}
function showFB(ok,t){
  const r=$('#fb-root');
  const ansStr=t.kind==='build'?t.ans.join(' '):t.kind==='write'?(t.ansArr?t.ansArr[0]:t.ans):t.kind==='tf'?(t.ans?'✅ Правда':'❌ Ложь'):String(t.ans);
  r.innerHTML='<div class="fb '+(ok?'ok':'no')+'"><div class="in">'+
    '<div class="msg"><b>'+(ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'❌ Неверно')+'</b>'+
    (ok?'':'<div style="margin-top:4px;font-weight:600">Правильный ответ: <span class="kr">'+esc(ansStr)+'</span></div><div style="font-size:13px;margin-top:3px;font-weight:600">'+esc(ENCOUR[Math.floor(Math.random()*ENCOUR.length)])+'</div>')+
    ((t.note&&(!ok||t.alwaysNote))?'<div style="font-size:12.5px;margin-top:5px;opacity:.85;font-weight:600">💡 '+esc(t.note)+'</div>':'')+
    '</div><button class="btn '+(ok?'green':'red')+' big" id="fb-go">Продолжить</button></div></div>';
  $('#fb-go').onclick=()=>{r.innerHTML='';L.i++;renderTask();};}
function completeLesson(){
  stopTimer();
  const answered=L.tasks.filter(t=>t.kind!=='card');
  const acc=answered.length?Math.round(100*L.ok/answered.length):100;
  const isLesson=L.mode==='lesson';
  let bonus=0;
  if(isLesson){
    bonus=50;
    if(L.finalAll&&L.tasks.some(t=>t.final))bonus+=100;
    if(L.bad===0)S.st.perfect++;
    S.completed[L.n]={acc,when:Date.now()};
    if(L.n>=S.currentLesson&&L.n<1000)S.currentLesson=L.n+1;
  } else bonus=20;
  addXP(bonus,true);floatXP(bonus);
  checkAchievements();saveProgress();updateTop();
  sfx('win');confetti(L.n===1000?160:80);
  const newWords=isLesson?L.plan.newItems.filter(x=>x.t!=='g').length:0;
  const finale=isLesson&&L.n===1000;
  const nn=L.n,mm=L.mode;
  const ttl=finale?'ПОЗДРАВЛЯЕМ!':(mm==='audio'?'Аудио-тренировка завершена!':(mm==='session'?'Тренировка завершена!':'Урок завершён!'));
  $('#view').innerHTML='<div id="lesson-wrap"><div class="acard center finale">'+
    (finale?'<div style="font-size:64px">🎉🎉🎉</div><div class="huge" style="margin:12px 0">ПОЗДРАВЛЯЕМ!</div><p style="font-weight:700;font-size:17px">Ты завершил все 1000 уроков!<br>Ты прошёл полный курс корейского языка. 화이팅!</p>'
    :'<div style="font-size:64px">🎉</div><div class="huge" style="margin:12px 0">'+ttl+'</div>')+
    '<div class="grid g2" style="margin:20px 0;text-align:left">'+
      '<div class="stat-tile"><div class="n" style="color:var(--gold)">+'+(L.xp+bonus)+' XP</div><div class="l">Заработано</div></div>'+
      '<div class="stat-tile"><div class="n">'+acc+'%</div><div class="l">Точность</div></div>'+
      '<div class="stat-tile"><div class="n">'+newWords+'</div><div class="l">Новых слов</div></div>'+
      '<div class="stat-tile"><div class="n" style="color:'+(acc>=80?'var(--green)':'var(--orange)')+'">'+L.ok+'/'+answered.length+'</div><div class="l">Верных ответов</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      (isLesson&&nn<1000?'<button class="btn red big" style="flex:1" id="c-next-l">Следующий урок →</button>':'')+
      (finale?'<button class="btn gold big" style="flex:1" id="c-map2">🗺️ Карта курса</button>':'')+
      '<button class="btn ghost" style="flex:1" id="c-rep">🔁 Повторить</button>'+
      '<button class="btn ghost" style="flex:1" id="c-map">К карте</button>'+
      '<button class="btn ghost" style="flex:1" id="c-ai">🤖 Спросить AI об уроке</button>'+
    '</div></div></div>';
  const nx=$('#c-next-l');if(nx)nx.onclick=()=>startLesson(nn+1);
  $('#c-rep').onclick=()=>{if(mm==='lesson')startLesson(nn);else if(mm==='audio')startAudioTrainer();else go('practice');};
  $('#c-map').onclick=()=>go('map');
  const m2=$('#c-map2');if(m2)m2.onclick=()=>go('map');
  $('#c-ai').onclick=()=>aiAsk('Объясни коротко главные слова и грамматику урока '+nn+' («'+lessonTitle(Math.max(1,nn))+'») и дай 3 примера.');
  document.body.classList.remove('in-lesson');}

  '<div class="notice" style="margin-top:14px">Приложение полностью бесплатное: без рекламы, подписок, лимитов и «жизней». 💚</div>';
  $('#sw-theme').onclick=e=>{S.set.theme=S.set.theme==='dark'?'light':'dark';applyTheme();e.target.classList.toggle('on',S.set.theme==='dark');saveProgress();};
  $('#sw-sound').onclick=e=>{S.set.sound=!S.set.sound;e.target.classList.toggle('on',S.set.sound);saveProgress();if(S.set.sound)sfx('ok');};
  $('#rg-vol').oninput=e=>{S.set.vol=+e.target.value;saveProgress();};
  $('#sel-rom').value=S.set.rom;$('#sel-rom').onchange=e=>{S.set.rom=e.target.value;saveProgress();};
  $('#rg-rate').oninput=e=>{S.set.rate=+e.target.value;saveProgress();};
  $('#tts-ko').onclick=()=>speak('안녕하세요! 반갑습니다!','ko-KR');
  $('#tts-ja').onclick=()=>speak('こんにちは。はじめまして。','ja-JP');
  $('#tts-en').onclick=()=>speak('Hello! Nice to meet you.','en-US');
  /* AI настройки */
  const prov=$('#ai-prov'),urlRow=$('#ai-url-row'),url=$('#ai-url'),model=$('#ai-model'),key=$('#ai-key');
  prov.value=ai.provider;url.value=ai.url;model.value=ai.model;key.value=ai.key;
  urlRow.style.display=ai.provider==='gemini'?'none':'';
  prov.onchange=()=>{ai.provider=prov.value;
    urlRow.style.display=ai.provider==='gemini'?'none':'';
    if(ai.provider==='gemini'&&(!model.value||model.value==='gpt-4o-mini'))model.value='gemini-2.0-flash';
    if(ai.provider==='openai'&&url.value.indexOf('openai.com')===-1&&url.value==='')url.value='https://api.openai.com/v1/chat/completions';};
  $('#ai-save').onclick=()=>{ai.provider=prov.value;ai.url=url.value.trim()||'https://api.openai.com/v1/chat/completions';
    ai.model=model.value.trim()||(ai.provider==='gemini'?'gemini-2.0-flash':'gpt-4o-mini');ai.key=key.value.trim();
    saveProgress();toast('Настройки AI сохранены','✅');};
  $('#ai-test').onclick=async()=>{
    ai.provider=prov.value;ai.url=url.value.trim()||'https://api.openai.com/v1/chat/completions';
    ai.model=model.value.trim()||(ai.provider==='gemini'?'gemini-2.0-flash':'gpt-4o-mini');ai.key=key.value.trim();saveProgress();
    if(!ai.key){toast('Сначала вставь API-ключ','⚠️');return;}
    const btn=$('#ai-test');btn.disabled=true;btn.textContent='⏳ Проверяю…';
    try{const r=await aiComplete('Ответь ровно одним корейским словом: 안녕');
      toast('AI работает! Ответ: '+r.slice(0,60),'✅');}
    catch(e){toast('Ошибка AI: '+e.message,'⚠️');}
    btn.disabled=false;btn.textContent='🧪 Проверить соединение';};
  $('#btn-exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='annon-progress-'+S.name+'.json';a.click();toast('Копия сохранена','💾');};
  $('#btn-imp').onclick=()=>$('#imp-file').click();
  $('#imp-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.st||!d.words)throw 0;
      normalizeState(d);d.name=S.name;S=d;saveProgress();applyTheme();updateTop();toast('Прогресс восстановлен!','✅');showSettings();}
    catch(x){toast('Файл не подходит','⚠️');}};rd.readAsText(f);};}
function resetProgress(){if(!confirm('Сбросить весь прогресс (XP, уроки, слова)? Профиль останется.'))return;
  const name=S.name;S=defaultState(name);saveProgress();updateTop();logout();}
function deleteProfile(){if(!confirm('Удалить профиль и ВСЕ данные безвозвратно?'))return;
  delete USERS[S.name.toLowerCase()];saveUsers();localStorage.removeItem(saveKey(S.name));logout();}
function applyTheme(){document.documentElement.dataset.theme=S?S.set.theme:'light';}

/* ---------- фоновые буквы ---------- */
(function bgGlyphs(){const g=['한','국','어','안','녕','김','밥','별','꿈','길','봄','소리'];
  const fx=$('#fx');for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=g[i%g.length];
    s.style.left=Math.random()*100+'vw';s.style.fontSize=(30+Math.random()*80)+'px';
    s.style.animationDuration=(35+Math.random()*45)+'s';s.style.animationDelay=(-Math.random()*40)+'s';fx.appendChild(s);}})();

/* ---------- слушатели AI-чата (один раз) ---------- */
$('#ai-fab').onclick=()=>{sfx('click');openAIChat();};
$('#ai-close').onclick=()=>$('#ai-panel').classList.add('hidden');
$('#ai-clear').onclick=()=>{if(confirm('Очистить историю переписки с AI?')){ensureAI();S.aiHist=[];saveProgress();renderAIMsgs();}};
$('#ai-send').onclick=sendAI;
$('#ai-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendAI();});
const AI_CHIPS=['Объясни частицу 은/는','Чем отличается 이/가 от 은/는?','Проспрягай глагол 가다','Дай 5 слов о еде','Устрой мне мини-тест'];
$('#ai-chips').innerHTML=AI_CHIPS.map(c=>'<button class="ai-chip">'+esc(c)+'</button>').join('');
$$('#ai-chips .ai-chip').forEach(b=>b.onclick=()=>{$('#ai-input').value=b.textContent;sendAI();});

/* ---------- старт ---------- */
function initApp(){
  loadUsers();
  const ses=localStorage.getItem(LSK_SES);
  if(ses&&USERS[ses]){S=loadProgress(USERS[ses].name)||defaultState(USERS[ses].name);
    applyTheme();setShell(true);updateTop();
    if(!S.placed)showLevelPick();else go('home');
  } else {setShell(false);showWelcome();}
}
window.addEventListener('beforeunload',()=>{if(S)saveProgress();});
initApp();
</script>
</body>
</html>
