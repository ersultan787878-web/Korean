<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аннён — курс корейского языка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rubik:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 1. ТОКЕНЫ И ТЕМЫ ============ */
:root{
  --font-head:'Manrope','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Rubik','Noto Sans KR',system-ui,sans-serif;

  --background:#F4F5F2;
  --surface:#FFFFFF;
  --surface-secondary:#F7F8F6;
  --text-primary:#1F2723;
  --text-secondary:#5F6E67;
  --border:#E3E7E1;
  --border-strong:#C9D2C9;

  --primary:#245FB3;
  --primary-hover:#1D4F97;
  --primary-soft:#E8EFF9;
  --success:#237F4F;
  --success-soft:#E5F2EA;
  --error:#C2453C;
  --error-soft:#F9E9E7;
  --warning:#A97511;
  --warning-soft:#F5EEDC;

  --shadow-sm:0 1px 2px rgba(20,28,24,.05);
  --shadow-md:0 1px 2px rgba(20,28,24,.04),0 6px 18px rgba(20,28,24,.06);
  --ring:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent);
  color-scheme:light;
}
[data-theme="dark"]{
  --background:#10151A;
  --surface:#171E25;
  --surface-secondary:#1D252E;
  --text-primary:#E7ECEF;
  --text-secondary:#94A2AC;
  --border:#26303A;
  --border-strong:#3A4652;

  --primary:#5C8FE6;
  --primary-hover:#77A2EA;
  --primary-soft:#1B2A44;
  --success:#4BAE7E;
  --success-soft:#17311F;
  --error:#E2695F;
  --error-soft:#391D1A;
  --warning:#D8A648;
  --warning-soft:#33270F;

  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 2px 6px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}

/* ============ 2. БАЗА ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--background);color:var(--text-primary);
  font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden;
  transition:background .3s ease,color .3s ease}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--primary) 25%,transparent)}
.hidden{display:none!important}
.kr{font-family:'Noto Sans KR',sans-serif}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.25}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ 3. ИКОНКИ ============ */
.icn{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
.icn-sm{width:16px;height:16px}
.icn-lg{width:24px;height:24px}
.icn-xl{width:32px;height:32px}

/* ============ 4. КАРКАС ============ */
#app{display:flex;min-height:100vh;position:relative;z-index:1}
#side{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--border);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:11px;padding:4px 10px 20px}
.logo-tile{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-family:'Noto Sans KR';font-weight:900;font-size:19px;flex-shrink:0}
.logo-name{font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:.2px}
.logo-sub{font-size:11px;color:var(--text-secondary);font-weight:500;letter-spacing:.4px}
.side-sep{height:1px;background:var(--border);margin:10px 8px}
.side-spacer{flex:1}
.side-stat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  background:var(--surface-secondary);border:1px solid var(--border);margin-top:6px;font-size:13px;font-weight:600}
.side-stat .icn{color:var(--text-secondary)}
.side-stat b{margin-left:auto;font-family:var(--font-head)}
.side-lvlbar{height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
.side-lvlbar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .5s ease}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 28px;background:color-mix(in srgb,var(--background) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
#top-title{font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:8px}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
  font-family:var(--font-head);font-weight:800;font-size:15px;border:1px solid var(--border);
  transition:transform .15s ease}
.avatar-btn:hover{transform:scale(1.06)}

#view{width:100%;max-width:1060px;margin:0 auto;padding:26px 28px 96px;animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 5. НАВИГАЦИЯ ============ */
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;
  font-weight:600;font-size:14px;color:var(--text-secondary);text-align:left;transition:background .15s,color .15s}
.navbtn:hover{background:var(--surface-secondary);color:var(--text-primary)}
.navbtn.act{background:var(--primary-soft);color:var(--primary);font-weight:700}
.navbtn .icn{width:19px;height:19px}

#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--text-secondary);padding:6px 2px;border-radius:10px}
#bnav button.act{color:var(--primary)}
body.in-lesson #bnav{display:none!important}

/* ============ 6. КОМПОНЕНТЫ ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-sm);padding:20px;transition:box-shadow .2s ease}
.card.pad-s{padding:16px}
.card.link{cursor:pointer}
.card.link:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.card.accent{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}

.h-page{font-size:24px;font-weight:800;margin-bottom:4px}
.h-sec{font-size:17px;font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
.h-sec .icn{color:var(--text-secondary)}
.h-card{font-size:15px;font-weight:700}
.p-sub{color:var(--text-secondary);font-size:14px}
.caption{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-secondary)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.tile{display:flex;flex-direction:column;gap:2px}
.tile .t-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.tile .t-val{font-family:var(--font-head);font-size:21px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.tile .t-lab{font-size:12px;color:var(--text-secondary);font-weight:600}
.t-ic.blue{background:var(--primary-soft);color:var(--primary)}
.t-ic.green{background:var(--success-soft);color:var(--success)}
.t-ic.amber{background:var(--warning-soft);color:var(--warning)}
.t-ic.red{background:var(--error-soft);color:var(--error)}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap}
.chip .icn{width:15px;height:15px;color:var(--text-secondary)}
.chip.c-flame .icn{color:var(--warning)}
.chip.c-bolt .icn{color:var(--primary)}

.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;background:var(--surface-secondary);border:1px solid var(--border);color:var(--text-secondary)}

.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--border) 70%,var(--surface));overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .6s cubic-bezier(.25,.8,.35,1)}
.bar.big{height:12px}
.bar.slim{height:5px}
.bar>i.ok{background:var(--success)}
.bar>i.warm{background:var(--warning)}

.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.g{background:var(--success)}.dot.y{background:var(--warning)}.dot.r{background:var(--error)}

.divider{height:1px;background:var(--border);margin:16px 0}

/* ============ 7. КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;
  border-radius:12px;border:1px solid transparent;font-weight:600;font-size:14.5px;line-height:1;
  transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;user-select:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text-primary)}
.btn-secondary:hover:not(:disabled){background:var(--surface-secondary)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover:not(:disabled){background:var(--surface-secondary);color:var(--text-primary)}
.btn-danger{background:var(--error);color:#fff}
.btn-danger:hover:not(:disabled){background:color-mix(in srgb,var(--error) 88%,black)}
.btn-danger-ghost{background:transparent;color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,var(--border))}
.btn-danger-ghost:hover:not(:disabled){background:var(--error-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:color-mix(in srgb,var(--success) 88%,black)}
.btn-sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px;gap:6px}
.btn-lg{height:50px;padding:0 24px;font-size:15.5px;border-radius:14px}
.btn-icon{width:44px;padding:0}
.btn-icon.btn-sm{width:36px}
.btn.wide{width:100%}

.inp{width:100%;height:46px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);
  padding:0 14px;font-size:14.5px;font-weight:500;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
textarea.inp{height:auto;padding:11px 14px;resize:vertical}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text-secondary);margin:16px 0 6px}

.sw{width:46px;height:26px;border-radius:99px;background:var(--border-strong);position:relative;
  transition:background .2s;flex-shrink:0;border:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow-sm);transition:left .2s}
.sw.on{background:var(--success)}
.sw.on::after{left:23px}

.notice{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--border-strong);border-radius:12px;
  padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-top:16px}
.notice .icn{margin-top:1px;color:var(--text-secondary)}

/* ============ 8. АУТЕНТИФИКАЦИЯ ============ */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.acard{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow-md);padding:36px 32px;animation:viewIn .35s ease}
.acard .logo-tile{width:56px;height:56px;font-size:26px;border-radius:16px;margin:0 auto 18px}
.acard h1{font-size:24px;text-align:center}
.acard .p-sub{text-align:center;margin:8px 0 22px}
.err{color:var(--error);font-weight:600;font-size:13.5px;margin-top:10px;min-height:18px}
.lvbtn{width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:15px 16px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:14px;background:var(--surface);transition:border-color .15s,background .15s,transform .1s}
.lvbtn:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.lv-num{width:34px;height:34px;border-radius:50%;background:var(--surface-secondary);border:1px solid var(--border);
  display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:14px;color:var(--text-secondary);flex-shrink:0}
.lvbtn b{display:block;font-size:14px;font-family:var(--font-head)}
.lvbtn small{color:var(--text-secondary);font-size:12.5px;font-weight:500}

/* ============ 9. КАРТА / ЭТАПЫ ============ */
.stage{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.stage .hd{display:flex;align-items:center;gap:13px;width:100%;padding:15px 18px;text-align:left;transition:background .15s}
.stage .hd:hover{background:var(--surface-secondary)}
.st-badge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;
  font-family:var(--font-head);font-weight:800;font-size:15px;flex-shrink:0}
.stage .tt{flex:1;min-width:0}
.stage .tt b{display:block;font-family:var(--font-head);font-size:14.5px}
.stage .tt small{color:var(--text-secondary);font-size:12px;font-weight:500}
.stage .pct{font-family:var(--font-head);font-weight:800;font-size:13.5px;color:var(--text-secondary)}
.stage .chev{color:var(--text-secondary);transition:transform .25s}
.stage.open .chev{transform:rotate(180deg)}
.stage .body{display:none;padding:6px 18px 18px}
.stage.open .body{display:block;animation:viewIn .25s ease}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.lnode{aspect-ratio:1;border-radius:11px;border:1px solid var(--border);display:grid;place-items:center;
  font-weight:700;font-size:12.5px;background:var(--surface);color:var(--text-secondary);
  transition:transform .12s,border-color .12s,background .12s;padding:0}
.lnode.done{background:var(--success);border-color:var(--success);color:#fff}
.lnode.cur{background:var(--surface);border:2px solid var(--primary);color:var(--primary);animation:curPulse 2s ease-in-out infinite}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 35%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.lnode.avail:hover{transform:translateY(-2px);border-color:var(--border-strong);color:var(--text-primary)}
.lnode.lock{opacity:.45;cursor:not-allowed}

/* ============ 10. УРОК / ЗАДАНИЯ ============ */
#lesson-wrap{max-width:680px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lhead .bar{flex:1}
.lcount{font-size:12.5px;font-weight:700;color:var(--text-secondary);white-space:nowrap}
.combo{display:inline-flex;align-items:center;gap:5px;color:var(--warning);font-weight:700;font-size:12.5px;white-space:nowrap}
.lmeta{font-size:13px;color:var(--text-secondary);font-weight:600;margin:6px 0 12px}
.lsec{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);margin:18px 0 8px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-md);
  padding:26px;animation:viewIn .28s ease}
.qtitle{font-family:var(--font-head);font-size:17px;font-weight:800}
.qword{font-family:'Noto Sans KR';font-weight:900;font-size:clamp(30px,6vw,44px);margin:16px 0 2px;line-height:1.2}
.qrom{color:var(--text-secondary);font-weight:600;font-size:14px}
.qprompt{font-size:15px;font-weight:600;color:var(--text-secondary);margin:8px 0 2px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;border:1px solid var(--border);
  border-radius:13px;background:var(--surface);font-weight:600;font-size:15px;text-align:left;min-height:52px;
  transition:border-color .13s,background .13s,transform .1s;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--border-strong);background:var(--surface-secondary)}
.opt:disabled{cursor:default}
.opt .key{width:27px;height:27px;border-radius:8px;background:var(--surface-secondary);border:1px solid var(--border);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text-secondary);flex-shrink:0;font-family:var(--font-head)}
.opt .olabel{flex:1;min-width:0}
.opt .ostate{display:none}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .key{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.right{border-color:var(--success);background:var(--success-soft)}
.opt.right .key{background:var(--success);border-color:var(--success);color:#fff}
.opt.right .ostate{display:inline-flex;color:var(--success)}
.opt.wrong{border-color:var(--error);background:var(--error-soft);animation:shake .35s ease}
.opt.wrong .key{background:var(--error);border-color:var(--error);color:#fff}
.opt.wrong .ostate{display:inline-flex;color:var(--error)}
.opt.krb .olabel{font-family:'Noto Sans KR';font-weight:500}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.ainp-ok{border-color:var(--success)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 25%,transparent)!important}
.ainp-no{border-color:var(--error)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--error) 25%,transparent)!important}

.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;border-bottom:1.5px dashed var(--border-strong);padding:10px 2px;margin:16px 0 12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tk{border:1px solid var(--border-strong);border-radius:11px;padding:9px 14px;background:var(--surface);
  font-family:'Noto Sans KR';font-weight:500;font-size:16px;transition:transform .12s,background .12s;animation:viewIn .2s ease}
.tk:hover{background:var(--surface-secondary);transform:translateY(-2px)}

/* аудио-плеер */
.audio{display:flex;align-items:center;gap:13px;flex-wrap:wrap;border:1px solid var(--border);
  background:var(--surface-secondary);border-radius:16px;padding:12px 14px;margin:18px 0}
.audio-play{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;
  flex-shrink:0;transition:background .15s,transform .1s;box-shadow:var(--shadow-sm)}
.audio-play:hover{background:var(--primary-hover)}
.audio-play:active{transform:scale(.95)}
.audio-play.playing{animation:aPulse 1.3s ease-in-out infinite}
@keyframes aPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 40%,transparent)}50%{box-shadow:0 0 0 11px transparent}}
.audio-meta{flex:1;min-width:150px}
.audio-state{display:block;font-weight:700;font-size:14px}
.audio-sub{display:block;font-size:12.5px;color:var(--text-secondary)}
.audio-vol{display:flex;align-items:center;gap:7px;color:var(--text-secondary)}
.audio-vol input{width:86px;accent-color:var(--primary)}

.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);
  box-shadow:0 -6px 24px rgba(15,23,30,.08);padding:14px 20px calc(14px + env(safe-area-inset-bottom));animation:fbUp .25s ease}
@keyframes fbUp{from{transform:translateY(100%)}}
.fb .in{max-width:680px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.fb.ok .fb-ic{background:var(--success-soft);color:var(--success)}
.fb.no .fb-ic{background:var(--error-soft);color:var(--error)}
.fb .msg{flex:1;min-width:200px}
.fb .msg b{font-size:15.5px;font-family:var(--font-head)}
.fb .msg .sub{font-size:13.5px;font-weight:500;margin-top:2px}
.fb .msg .note{font-size:12.5px;color:var(--text-secondary);margin-top:5px;font-weight:500}

.lesson-card-center{text-align:center}

.levelbox{text-align:center;min-width:120px;padding:6px 4px}

.levelbox small{color:var(--text-secondary);font-size:11.5px;font-weight:600}

.wrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);

.wrow .wk{font-family:'Noto Sans KR';font-weight:700;font-size:16.5px}
.wrow .wr{color:var(--text-secondary);font-size:12px;font-weight:500;margin-left:6px}
.wrow .wru{font-size:13.5px;font-weight:600}

.seg{display:flex;gap:8px;flex-wrap:wrap}

.aprog .ap b{font-family:var(--font-head);font-size:15px;display:block}
.aprog .ap span{font-size:11.5px;color:var(--text-secondary);font-weight:600}
.icobox{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}

.chart{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:14px}
.chart i{flex:1;background:var(--primary);opacity:.85;border-radius:5px 5px 2px 2px;min-height:4px;position:relative;transition:opacity .15s}
.chart i:hover{opacity:1}
.chart i:hover::after{content:attr(data-v);position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  font-size:10.5px;font-weight:700;background:var(--text-primary);color:var(--background);border-radius:6px;padding:2px 7px;white-space:nowrap}
.donut{width:124px;height:124px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--surface)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-family:var(--font-head);font-size:20px}
.tbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;font-weight:600}
.tbar span:first-child{width:112px;flex-shrink:0;color:var(--text-secondary)}
.tbar .bar{flex:1}

.achcard{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:18px 14px;text-align:center;
  transition:transform .15s,box-shadow .15s}
.achcard:not(.lock):hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.achcard .a-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;

.achcard b{font-size:13.5px;display:block;font-family:var(--font-head)}
.achcard small{color:var(--text-secondary);font-size:11.5px;font-weight:500;display:block;margin-top:3px}
.achcard.lock{opacity:.5}
.achcard.lock .a-ic{background:var(--surface-secondary);color:var(--text-secondary)}
.achcard .a-date{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:var(--success)}

  font-family:var(--font-head);font-weight:800;font-size:32px;flex-shrink:0}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.theme-opt{border:1px solid var(--border);border-radius:13px;padding:14px 10px;text-align:center;font-weight:600;font-size:13.5px;

.theme-opt:hover{border-color:var(--border-strong)}
.theme-opt.sel{border-color:var(--primary);background:var(--primary-soft)}

.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.swrow:last-child{border-bottom:none}
.swrow .swl{font-weight:600;font-size:14px}
.swrow .swd{font-size:12.5px;color:var(--text-secondary)}

#ai-fab{position:fixed;right:20px;bottom:22px;z-index:70;width:54px;height:54px;border-radius:17px;
  background:var(--text-primary);color:var(--background);display:grid;place-items:center;box-shadow:var(--shadow-md);
  transition:transform .15s}
#ai-fab:hover{transform:translateY(-3px)}

.ai-msg.bot{align-self:flex-start;background:var(--surface)}
.ai-note{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border-strong);border-radius:12px;padding:11px 13px;background:var(--surface)}

.ai-in .inp{flex:1;height:42px}

#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;

/* ---------- план 1000 уроков ---------- */
const PLANS=[null], IL={};
(function buildAllPlans(){
  let wC=0,pC=0,gC=0;
  for(let n=1;n<=1000;n++){
    let type,newItems=[];
    if(n<=4){type='hangul';}
    else if(n%9===0)type='review';
    else if(n%13===0)type='listen';
    else if(n>=15&&n%7===0)type='grammar';
    else type='vocab';
    if(type==='vocab'){
      let k=n<=600?4:5;
      while(k>0&&wC<W.length){newItems.push({t:'w',i:wC});wC++;k--;}
      if(!newItems.length){let k2=2;while(k2>0&&pC<PH.length){newItems.push({t:'p',i:pC});pC++;k2--;}}
    }else if(type==='listen'){
      if(pC<PH.length){newItems.push({t:'p',i:pC});pC++;}
    }else if(type==='grammar'){
      if(gC<G.length){newItems.push({t:'g',i:gC});gC++;}
    }
    newItems.forEach(it=>IL[it.t+it.i]=n);
    PLANS.push({n,type,newItems});
  }
})();
function itemGet(r){return r.t==='w'?W[r.i]:r.t==='p'?PH[r.i]:G[r.i]}
function itemCat(r){return r.t==='w'?(W[r.i].f==='v'?'act':W[r.i].f==='a'?'qal':W[r.i].c):r.t==='p'?'phr':'gra'}
function lessonTitle(n){
  const p=PLANS[n];
  if(p.type==='hangul')return HANGUL_TITLES[n-1];
  const s=stageOf(n),topics=TOP[STG.indexOf(s)];
  const topic=topics[Math.floor((n-s.a)/5)%topics.length];
  if(p.type==='review')return 'Повторение · '+topic;
  if(p.type==='listen')return 'Аудирование · '+topic;
  if(p.type==='grammar'&&p.newItems[0])return 'Грамматика · '+G[p.newItems[0].i][0];
  if(!p.newItems.length)return 'Повторение · '+topic;
  return topic+' · ч.'+(Math.floor((n-s.a)/(5*topics.length))+1);
}

/* ---------- АУДИО: Web Speech API ---------- */
let VOICES=[], VOICE_MISSING_SHOWN={};
function refreshVoices(){if(!('speechSynthesis' in window))return;try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if('speechSynthesis' in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;}
function pickVoiceFor(lang){
  if(!VOICES.length)refreshVoices();
  const exact=VOICES.filter(v=>v.lang===lang);
  if(exact.length)return exact[0];
  const base=String(lang).split('-')[0];
  const near=VOICES.filter(v=>v.lang&&String(v.lang).toLowerCase().startsWith(base.toLowerCase()));
  if(near.length)return near[0];
  return null;
}
function hasVoice(lang){return !!pickVoiceFor(lang)}
function speak(text,lang,rate,onDone){
  lang=lang||'ko-KR';
  if(!text){if(onDone)onDone();return false;}
  if(!('speechSynthesis' in window)){toast('Браузер не поддерживает озвучку речи','alert');if(onDone)onDone();return false;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    const v=pickVoiceFor(lang);
    if(v)u.voice=v;

    const pairs=q.options.map((o,i)=>({o:o,ok:i===idx}));
    const sp=shuf(rng,pairs);
    return Object.assign({kind:'listen',q:'Прослушайте и выберите правильный вариант',opts:sp.map(x=>x.o),ans:q.options[idx],
      note:q.word+' — '+q.translation},base);
  }
  if(q.type==='listen-choice'){
    const dis=distrKr(q,3,rng);
    return Object.assign({kind:'listen',q:'Прослушайте и выберите слово, которое прозвучало',
      opts:shuf(rng,[q.word].concat(dis)),ans:q.word,kr:true,hint:q.rom||'',
      note:'Прозвучало: '+q.word+(q.rom?' ['+q.rom+']':'')+' — '+q.translation},base);
  }
  if(q.type==='listen-translate'){
    const dis=distrRu(q,3,rng);
    return Object.assign({kind:'listen',q:'Прослушайте и выберите перевод',
      opts:shuf(rng,[q.translation].concat(dis)),ans:q.translation,hint:q.rom||'',
      note:'«'+q.word+'» = '+q.translation},base);
  }
  if(q.type==='listen-phrase-translate'){
    const dis=distrRu(q,3,rng);
    return Object.assign({kind:'listen',q:'Прослушайте фразу и выберите перевод',
      opts:shuf(rng,[q.translation].concat(dis)),ans:q.translation,hint:q.rom||'',
      note:'«'+q.word+'» = '+q.translation},base);
  }
  if(q.type==='listen-write'){
    const acc=[String(q.word).toLowerCase()];
    if(q.rom)acc.push(String(q.rom).toLowerCase());
    return Object.assign({kind:'write',q:'Прослушайте и напишите услышанное слово',
      ans:q.word,ansArr:acc,hint:q.rom||'',
      note:'Правильно: '+q.word+(q.rom?' ['+q.rom+']':'')+' — '+q.translation},base);
  }
  if(q.type==='listen-build'){
    const tokens=String(q.word).split(' ');
    return Object.assign({kind:'build',q:'Прослушайте и соберите фразу по порядку',
      hint:q.translation,tokens:tokens,bank:shuf(rng,tokens.slice()),ans:tokens,
      note:'Правильно: '+q.word+' — '+q.translation},base);
  }
  if(q.type==='listen-tf'){
    const isTrue=rng()<.5;let t2=q.translation;
    if(!isTrue){const alt=distrRu(q,1,rng)[0];if(alt)t2=alt;}
    return Object.assign({kind:'tf',q:'Прослушайте. Правда или ложь?',
      stmt:q.word+' — это «'+t2+'»',ans:(t2===q.translation),
      note:'«'+q.word+'» = '+q.translation},base);
  }
  return Object.assign({kind:'listen',q:'Прослушайте',opts:[q.translation],ans:q.translation},base);
}
function itemToQ(it){
  if(it.t==='w'){const w=W[it.i];return {type:'listen-choice',key:'w'+it.i,word:w.k,translation:w.ru,rom:w.r,audioText:w.k,lang:'ko-KR',src:'w'};}
  const p=PH[it.i];return {type:'listen-phrase-translate',key:'p'+it.i,word:p[0],translation:p[2],rom:p[1],audioText:p[0],lang:'ko-KR',src:'p'};
}

/* ---------- генератор заданий урока ---------- */
function romShown(n){if(!S)return true;return S.set.rom==='on'||(S.set.rom==='auto'&&n<=40)}
function optCount(n){return n>750?4:3}
function distractors(ref,rng,k){
  const res=[],seen={};
  if(ref.t==='w'){const w=W[ref.i];
    for(let i=0;i<W.length;i++){if(i===ref.i)continue;const c=W[i];
      if((c.f===w.f&&w.f!=='')||c.c===w.c){res.push({t:'w',i});seen[i]=1;if(res.length>=k*3)break;}}}
  else if(ref.t==='p'){for(let i=0;i<PH.length;i++){if(i!==ref.i&&Math.abs(PH[i][3]-itemGet(ref)[3])<=1){res.push({t:'p',i});if(res.length>=k*3)break;}}}
  else{for(let i=0;i<G.length;i++){if(i!==ref.i)res.push({t:'g',i});if(res.length>=k*3)break;}}
  let g=0;while(res.length<k&&g<400){const i=Math.floor(rng()*W.length);if(!seen[i]){seen[i]=1;res.push({t:'w',i});}g++;}
  return shuf(rng,res).slice(0,k);}
function pickItem(rng,pool){
  let tot=0;const ws=pool.map(r=>{let w=1;if(r.t==='w'&&S&&S.words[r.i]){const d=S.words[r.i];if(d.bad>0)w+=3*d.bad/(d.ok+d.bad);}tot+=w;return w;});
  let x=rng()*tot;for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i];}return pool[pool.length-1];}
function pastItems(n,rng,k){
  const out=[],seen={};
  for(let m=Math.max(1,n-30);m<n;m++){for(const r of PLANS[m].newItems){if(!seen[r.t+r.i]){seen[r.t+r.i]=1;out.push(r);}}}
  if(S){for(const i of mistakeWords()){const key='w'+i;if(!seen[key]&&out.length<60){seen[key]=1;out.push({t:'w',i});}}}
  return shuf(rng,out).slice(0,k);}
function genExample(w){
  if(w.f==='v'){const base=CM[w.k]||'';return ['저는 '+base+w.yo,'Пример с «'+w.ru.toLowerCase()+'»'];}
  if(w.f==='a')return [w.yo+'!','«'+w.ru.toLowerCase()+'»'];
  if(w.f==='e')return [w.k+part(w.k,'sub')+' 맛있어요','«'+w.ru+'» — вкусный'];
  if(w.f==='d')return [w.k+part(w.k,'obj')+' 마셔요','Я пью «'+w.ru.toLowerCase()+'»'];
  if(w.f==='p')return [w.k+part(w.k,'loc')+' 가고 싶어요','Хочу поехать: «'+w.ru+'»'];
  if(w.f==='h')return [w.k+part(w.k,'obj')+' 만났어요','Я встретил: «'+w.ru+'»'];
  if(w.f==='t')return [w.k+' 뭐 해요?','Что делаешь ('+w.ru.toLowerCase()+')?'];
  return ['저는 '+w.k+part(w.k,'obj')+' 좋아해요','Мне нравится: «'+w.ru.toLowerCase()+'»'];}
const CM={'가다':'학교에 ','오다':'집에 ','먹다':'밥을 ','마시다':'물을 ','보다':'영화를 ','읽다':'책을 ','쓰다':'편지를 ','듣다':'음악을 ','배우다':'한국어를 ','사다':'선물을 ','만나다':'친구를 ','타다':'버스를 '};
function buildSentenceFor(it){
  if(it.t==='p')return [PH[it.i][0],PH[it.i][2]];
  const w=W[it.i];
  if(w.f==='v'){if(CM[w.k])return [CM[w.k]+w.yo,'Пример с глаголом «'+w.ru.toLowerCase()+'»'];return ['저는 매일 '+w.yo,'Каждый день: «'+w.ru.toLowerCase()+'»'];}
  if(w.f==='a'){const subj={'좋다':'기분이','크다':'집이','작다':'방이','어렵다':'한국어가','맛있다':'음식이','예쁘다':'꽃이','비싸다':'가방이','재미있다':'영화가','덥다':'여름이','춥다':'겨울이','빠르다':'기차가','중요하다':'건강이','조용하다':'도서관이','위험하다':'밤길이'}[w.k];
    return subj?[subj+' '+w.yo,'Пример с «'+w.ru.toLowerCase()+'»']:null;}
  if(w.f==='e')return [w.k+part(w.k,'sub')+' 맛있어요','«'+w.ru+'» — вкусно'];
  if(w.f==='d')return ['저는 '+w.k+part(w.k,'obj')+' 마셔요','Я пью: '+w.ru.toLowerCase()];
  if(w.f==='p')return [w.k+part(w.k,'loc')+' 가고 싶어요','Хочу поехать: '+w.ru.toLowerCase()];
  if(w.f==='h')return [w.k+part(w.k,'obj')+' 만났어요','Я встретил: '+w.ru.toLowerCase()];
  if(w.f==='t')return [w.k+' 뭐 해요?','Что делаешь ('+w.ru.toLowerCase()+')?'];
  return ['저는 '+w.k+part(w.k,'obj')+' 좋아해요','Мне нравится: '+w.ru.toLowerCase()];}
function tChoice(it,rng,plan){
  const n=(plan&&plan.n)||300;
  if(it.t==='g'){const g=G[it.i];const dis=shuf(rng,G.filter((x,i)=>i!==it.i).map(x=>x[1])).slice(0,optCount(n));
    return {kind:'choice',q:'Что выражает конструкция «'+g[0]+'»?',opts:shuf(rng,[g[1]].concat(dis)),ans:g[1],ref:it,alwaysNote:true,
      note:g[0]+' — '+g[1]+'. Пример: '+g[3]+' — '+g[5]+'.'};}
  const it2=itemGet(it);
  if(it.t==='p'){const dis=distractors(it,rng,optCount(n)).map(d=>itemGet(d)[2]);
    return {kind:'choice',q:'Что означает фраза:',kw:it2[0],rom:romShown(n)?it2[1]:'',opts:shuf(rng,[it2[2]].concat(dis)),ans:it2[2],ref:it,note:'«'+it2[0]+'» = '+it2[2]};}
  const w=W[it.i],dis=distractors(it,rng,optCount(n)).map(d=>W[d.i].ru);
  return {kind:'choice',q:'Что означает:',kw:w.k,rom:romShown(IL['w'+it.i]||50)?w.r:'',opts:shuf(rng,[w.ru].concat(dis)),ans:w.ru,ref:it,note:'«'+w.k+'» ['+w.r+'] = '+w.ru};}
function tReverse(it,rng,plan){
  const n=(plan&&plan.n)||300;
  if(it.t==='p'){const w=PH[it.i];const dis=distractors(it,rng,optCount(n)).map(d=>itemGet(d)[0]);
    return {kind:'choice',q:'Как по-корейски: «'+w[2]+'»?',opts:shuf(rng,[w[0]].concat(dis)),ans:w[0],ref:it,kr:true,note:w[0]+' = '+w[2]};}
  const w=W[it.i];const dis=distractors(it,rng,optCount(n)).map(d=>W[d.i].k);
  return {kind:'choice',q:'Как будет «'+w.ru.toLowerCase()+'»?',opts:shuf(rng,[w.k].concat(dis)),ans:w.k,ref:it,kr:true,note:w.k+' ['+w.r+'] = '+w.ru};}
function tTF(it,rng){
  const w=itemGet(it);let stmt,ans;
  if(it.t==='g'){const ok=rng()<.5;let m2=w[1];
    if(!ok){m2=G[(it.i+1+Math.floor(rng()*(G.length-2)))%G.length][1];if(m2===w[1])m2=G[(it.i+7)%G.length][1];}
    stmt='«'+w[0]+'» означает: «'+m2+'»';ans=(m2===w[1]);}
  else{const ru=it.t==='p'?w[2]:w.ru,k=it.t==='p'?w[0]:w.k;const ok=rng()<.5;let ru2=ru;
    if(!ok){if(it.t==='p'){ru2=PH[(it.i+1+Math.floor(rng()*(PH.length-2)))%PH.length][2];if(ru2===ru)ru2=PH[(it.i+7)%PH.length][2];}
      else{ru2=W[(it.i+1+Math.floor(rng()*(W.length-2)))%W.length].ru;if(ru2===ru)ru2=W[(it.i+13)%W.length].ru;}}
    ans=(ru===ru2);stmt=k+' — это «'+ru2+'»';}
  return {kind:'tf',q:'Правда или ложь?',stmt,ans,ref:it,
    note:'Правильное значение: '+(it.t==='p'?w[0]+' = '+w[2]:it.t==='g'?w[0]+' — '+w[1]:w.k+' = '+w.ru)};}
function tListen(it,rng,plan){
  const n=(plan&&plan.n)||300;
  const q=itemToQ(it);
  const roll=rng();
  if(it.t==='w'&&n>=120&&roll<0.22&&W[it.i].k.length<=4)q.type='listen-write';
  else if(it.t==='p'&&n>=150&&roll<0.45)q.type='listen-build';
  else if(n>=140&&roll<0.62)q.type='listen-translate';
  else if(n>=200&&roll<0.8)q.type='listen-tf';
  else q.type='listen-choice';
  const t=audioQuestionToTask(q,rng);
  t.ref=it;return t;}
function tGap(it,rng){
  const w=W[it.i];if(w.f==='v')return tConj(it,rng);if(w.f==='a')return tChoice(it,rng);
  let kinds;
  if(w.f==='p')kinds=['loc','obj','top'];
  else if(w.f==='h')kinds=['obj','gen','sub'];
  else kinds=['obj','sub','top'];
  const kk=kinds[Math.floor(rng()*kinds.length)];
  const ans=part(w.k,kk);
  const pool=['top','sub','obj','loc','gen','also','only'].filter(x=>x!==kk&&!(x==='loc'&&w.f!=='p'));
  const opts=shuf(rng,[ans].concat(shuf(rng,pool).slice(0,3).map(p=>part(w.k,p))));
  const verbMap={obj:(w.f==='e'?' 먹어요':w.f==='d'?' 마셔요':' 좋아해요'),sub:' 있어요',top:' 어때요?',loc:' 가요',gen:' 이름이 뭐예요?'};
  const explMap={obj:'을/를 — частица объекта (что? кого?)',sub:'이/가 — частица подлежащего (кто? что?)',top:'은/는 — частица темы',loc:'에 — направление/место «в, на»',gen:'의 — притяжательная частица «-ин, -ов»'};
  const sent=(kk==='gen'?'저는 '+w.k+'___':w.k+'___'+(verbMap[kk]||' 있어요'));
  return {kind:'gap',q:'Выберите правильную частицу',sent,opts,ans,ref:it,alwaysNote:true,
    note:explMap[kk]+'. После «'+w.k+'» (падчим: '+(batchim(w.k)?'есть':'нет')+') → '+ans+'.'};}
function tConj(it,rng){
  const w=W[it.i];if(w.f!=='v')return tChoice(it,rng);
  const fut=w.k.slice(0,-1)+'겠어요';
  const tenses=[['past','어제','Вчера',w.pa],['pres','매일','Каждый день',w.yo],['fut','내일','Завтра',fut]];
  const t=tenses[Math.floor(rng()*tenses.length)];
  const opts=shuf(rng,[w.yo,w.fm,w.pa,fut]);
  const obj=CM[w.k]||'';
  return {kind:'gap',q:'Выберите правильную форму глагола ('+t[1]+' — '+t[2]+')',
    sent:t[2]+' 저는 '+obj+'___',opts,ans:t[3],ref:it,alwaysNote:true,
    note:w.k+' («'+w.ru.toLowerCase()+'»): настоящее '+w.yo+', вежливая форма '+w.fm+', прошедшее '+w.pa+', будущее/предположение '+fut+'.'};}
function tBuild(it,rng,plan){
  const n=(plan&&plan.n)||300;
  const s=buildSentenceFor(it);if(!s)return tChoice(it,rng,plan);
  const tokens=s[0].split(' ');
  const decoys=[];
  if(n>500&&tokens.length>2){
    const other={t:'w',i:Math.floor(rng()*W.length)};
    const p2=buildSentenceFor(other);
    if(p2)p2[0].split(' ').forEach(tk=>{if(tokens.indexOf(tk)===-1&&decoys.length<(n>800?2:1)&&rng()<.6)decoys.push(tk);});}
  return {kind:'build',q:'Составьте предложение',hint:s[1],tokens,bank:shuf(rng,tokens.concat(decoys)),ans:tokens,ref:it,note:'Правильно: '+s[0]+' — '+s[1]};}
function tGapG(it,rng,plan){const g=G[it.i];const n=(plan&&plan.n)||300;
  const dis=shuf(rng,G.filter((x,i)=>i!==it.i).map(x=>x[3])).slice(0,optCount(n));
  return {kind:'choice',q:'Выберите пример на конструкцию «'+g[0]+'» ('+g[1]+')',
    opts:shuf(rng,[g[3]].concat(dis)),ans:g[3],ref:it,kr:true,alwaysNote:true,note:g[3]+' ['+g[4]+'] — '+g[5]};}
function tCard(it){return {kind:'card',ref:it};}
function mkTask(it,plan,rng){
  const n=plan.n||300,opts=[];
  if(it.t==='g'){opts.push(tChoice,tChoice,tTF);if(n>=60)opts.push(tGapG);return opts[Math.floor(rng()*opts.length)](it,rng,plan);}
  opts.push(tChoice,tTF,tListen);
  if(it.t==='w'){const w=W[it.i];
    opts.push(tReverse);
    if(w.f==='v'){if(n>=60)opts.push(tConj);if(n>=80)opts.push(tBuild);}
    else if(w.f==='a'){if(n>=80)opts.push(tBuild);}
    else{if(n>=30)opts.push(tGap);if(n>=45)opts.push(tBuild);}
  }else{if(n>=40)opts.push(tReverse);if(n>=55)opts.push(tBuild);}
  return opts[Math.floor(rng()*opts.length)](it,rng,plan);}
function generateLesson(plan){
  const rng=rng32(plan.n*7919+13),T=[];
  if(plan.type==='hangul'){
    const chars=HANGUL_LESSONS[plan.n-1];
    const lets=chars.map(c=>LET.find(l=>l[0]===c));
    lets.forEach(l=>T.push({kind:'card',letter:l}));
    for(let i=0;i<6;i++){const l=lets[i%lets.length];
      if(i%2===0){const dis=shuf(rng,LET.filter(x=>x[0]!==l[0]).map(x=>x[1])).slice(0,3);
        T.push({kind:'choice',q:'Как называется буква:',kw:l[0],opts:shuf(rng,[l[1]].concat(dis)),ans:l[1],note:l[0]+' — это '+l[1]+' ['+l[2]+'], звук: '+l[3]});}
      else{const dis=shuf(rng,LET.filter(x=>x[0]!==l[0]).map(x=>x[0])).slice(0,3);
        T.push({kind:'choice',q:'Найдите букву «'+l[1]+'» (звук: '+l[3]+')',opts:shuf(rng,[l[0]].concat(dis)),ans:l[0],kr:true,note:l[0]+' — это '+l[1]+' ['+l[2]+']'});}}
    return T;}
  plan.newItems.forEach(it=>T.push(tCard(it)));
  const pool=plan.newItems.concat(pastItems(plan.n,rng,8));
  if(!pool.length)for(let i=0;i<6;i++)pool.push({t:'w',i:Math.floor(rng()*Math.min(60,W.length))});
  const exN=5+Math.min(6,Math.floor(plan.n/150));
  for(let i=0;i<exN;i++){const it=pickItem(rng,pool);const t=mkTask(it,plan,rng);t.ref=it;T.push(t);}
  const finN=4+Math.min(9,Math.floor(plan.n/110));
  for(let i=0;i<finN;i++){const it=pickItem(rng,pool);const t=mkTask(it,plan,rng);t.final=true;t.ref=it;T.push(t);}
  return T;}

let tickIv=null;
function startTimer(){clearInterval(tickIv);tickIv=setInterval(()=>{if(S&&L){S.st.time++;if(S.st.time%15===0)saveProgress();}},1000);}
function stopTimer(){clearInterval(tickIv);}
function startLesson(n,mode){
  mode=mode||'lesson';
  if(n<1||n>1000)return;
  const plan=PLANS[n];
  L={n,mode,plan,tasks:generateLesson(plan),i:0,ok:0,bad:0,combo:0,xp:0,retried:new Set(),done:false,finalAll:true};
  document.body.classList.add('in-lesson');
  startTimer();renderLessonShell();renderTask();}
function startSession(kind){
  let refs=[];
  const pseudoN=Math.max(60,Math.min(850,S.currentLesson));
  if(kind==='due')refs=dueWords().map(i=>({t:'w',i}));
  else if(kind==='mist')refs=mistakeWords().map(i=>({t:'w',i}));
  else if(kind==='listen')refs=shuffleArr(PH.map((p,i)=>({t:'p',i}))).slice(0,8);
  else refs=shuffleArr(W.map((w,i)=>({t:'w',i}))).filter(r=>S.words[r.i]&&S.words[r.i].s).slice(0,10);
  if(!refs.length){toast('Список пуст — пройдите пару уроков','info');return;}
  refs=refs.slice(0,14);
  const rng=rng32(Date.now()%1e9);
  const tasks=[];
  refs.forEach(r=>{const t=mkTask(r,{n:pseudoN},rng);t.ref=r;tasks.push(t);});
  L={n:0,mode:'session',plan:{n:pseudoN,type:'session',newItems:[]},tasks,i:0,ok:0,bad:0,combo:0,xp:0,retried:new Set(),done:false,finalAll:true};
  document.body.classList.add('in-lesson');
  startTimer();renderLessonShell();renderTask();}
function startAudioTrainer(){
  const tasks=[];
  for(let i=0;i<12;i++){const q=getRandomQuestion();if(!q)break;tasks.push(audioQuestionToTask(q,Math.random));}
  if(!tasks.length){toast('База заданий пуста','alert');return;}
  L={n:0,mode:'audio',plan:{n:300,type:'audio',newItems:[]},tasks,i:0,ok:0,bad:0,combo:0,xp:0,retried:new Set(),done:false,finalAll:true};

  startTimer();renderLessonShell();renderTask();}

function secLabel(t){if(t.kind==='card')return t.letter?'Хангыль':'Новое слово';if(t.final)return 'Финальное испытание';if(t.retry)return 'Повторение';if(t.audio)return 'Аудирование';return 'Практика';}
function audioBlockHTML(){

const RATE_STEPS=[0.7,0.9,1.1];
function bindAudioBlock(root,t){
  const playBtn=root.querySelector('[data-a="play"]');
  const state=root.querySelector('.audio-state');
  const sub=root.querySelector('.audio-sub');
  const rateBtn=root.querySelector('[data-a="rate"]');
  const replayBtn=root.querySelector('[data-a="replay"]');
  const vol=root.querySelector('[data-a="vol"]');
  let seq=0;
  const playFn=()=>{
    if(!t||!t.audio)return;
    if(S){ensureAudioStats();S.audio.listens++;saveProgress();}
    const sid=++seq;
    playBtn.classList.add('playing');state.textContent='Воспроизведение…';sub.textContent='Идёт озвучка фразы';
    speak(t.audio.text,t.audio.lang||'ko-KR',undefined,()=>{
      if(sid!==seq)return;
      playBtn.classList.remove('playing');state.textContent='Готово';sub.textContent='Можно прослушать ещё раз';});};
  playBtn.onclick=playFn;
  replayBtn.onclick=playFn;
  rateBtn.onclick=()=>{
    let idx=RATE_STEPS.findIndex(r=>Math.abs(r-((S&&S.set.rate)||0.9))<0.05);
    idx=(idx+1)%RATE_STEPS.length;
    if(S){S.set.rate=RATE_STEPS[idx];saveProgress();}
    rateBtn.textContent=RATE_STEPS[idx]+'×';};
  vol.oninput=e=>{if(S){S.set.vol=+e.target.value;saveProgress();}};
  return playFn;}

    const inp=$('#w-inp');if(inp){inp.disabled=true;inp.classList.add(ok?'ainp-ok':'ainp-no');}}

    let gain=10;if(L.combo>0&&L.combo%3===0)gain+=5;

  $('#rg-vol').oninput=e=>{S.set.vol=+e.target.value;saveProgress();};
  $('#rg-rate').oninput=e=>{S.set.rate=+e.target.value;saveProgress();};
  $('#sel-rom').value=S.set.rom;$('#sel-rom').onchange=e=>{S.set.rom=e.target.value;saveProgress();};
  $('#tts-ko').onclick=()=>speak('안녕하세요! 반갑습니다!','ko-KR');
  $('#tts-ja').onclick=()=>speak('こんにちは。はじめまして。','ja-JP');
  $('#tts-en').onclick=()=>speak('Hello! Nice to meet you.','en-US');
  const prov=$('#ai-prov'),urlRow=$('#ai-url-row'),url=$('#ai-url'),model=$('#ai-model'),key=$('#ai-key');
  prov.value=ai.provider;url.value=ai.url;model.value=ai.model;key.value=ai.key;
  urlRow.style.display=ai.provider==='gemini'?'none':'';
  prov.onchange=()=>{ai.provider=prov.value;
    urlRow.style.display=ai.provider==='gemini'?'none':'';
    if(ai.provider==='gemini'&&(!model.value||model.value==='gpt-4o-mini'))model.value='gemini-3.6-flash';};
  $('#ai-save').onclick=()=>{ai.provider=prov.value;ai.url=url.value.trim()||'https://api.openai.com/v1/chat/completions';
    ai.model=model.value.trim()||(ai.provider==='gemini'?'gemini-3.6-flash':'gpt-4o-mini');ai.key=key.value.trim();
    saveProgress();toast('Настройки AI сохранены','check');};
  $('#ai-test').onclick=async()=>{
    ai.provider=prov.value;ai.url=url.value.trim()||'https://api.openai.com/v1/chat/completions';
    ai.model=model.value.trim()||(ai.provider==='gemini'?'gemini-3.6-flash':'gpt-4o-mini');ai.key=key.value.trim();saveProgress();
    if(!ai.key){toast('Сначала вставьте API-ключ','alert');return;}
    const btn=$('#ai-test');btn.disabled=true;btn.innerHTML='Проверяю…';
    try{const r=await aiComplete('Ответь ровно одним корейским словом: 안녕');
      toast('AI работает: '+r.slice(0,50),'check');}
    catch(e){toast('Ошибка AI: '+e.message,'alert');}
    btn.disabled=false;btn.innerHTML=ic('sparkle')+'Проверить соединение';};
  $('#btn-exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='annon-progress-'+S.name+'.json';a.click();toast('Копия сохранена','download');};
  $('#btn-imp').onclick=()=>$('#imp-file').click();
  $('#imp-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.st||!d.words)throw 0;
      normalizeState(d);d.name=S.name;S=d;saveProgress();applyTheme();updateTop();toast('Прогресс восстановлен','check');showSettings();}
    catch(x){toast('Файл не подходит','alert');}};rd.readAsText(f);};}
function resetProgress(){if(!confirm('Сбросить весь прогресс (XP, уроки, слова)? Профиль останется.'))return;
  const name=S.name;S=defaultState(name);saveProgress();updateTop();logout();}
function deleteProfile(){if(!confirm('Удалить профиль и ВСЕ данные безвозвратно?'))return;
  delete USERS[S.name.toLowerCase()];saveUsers();localStorage.removeItem(saveKey(S.name));logout();}

/* ---------- AI-панель (каркас) ---------- */
function buildAIPanel(){
  $('#ai-fab').innerHTML=ic('sparkle','icn-lg');
  $('#ai-panel').innerHTML=
    '<div class="ai-hd"><div class="t">'+ic('sparkle')+'AI-помощник</div>'+
    '<div class="acts"><button class="iconbtn" id="ai-clear" aria-label="Очистить историю">'+ic('trash','icn-sm')+'</button>'+
    '<button class="iconbtn" id="ai-close" aria-label="Закрыть">'+ic('x','icn-sm')+'</button></div></div>'+
    '<div id="ai-msgs"></div>'+
    '<div class="ai-chips" id="ai-chips"></div>'+
    '<div class="ai-in"><input class="inp" id="ai-input" placeholder="Спросите о корейском…" autocomplete="off" aria-label="Вопрос AI">'+
    '<button class="btn btn-primary btn-icon" id="ai-send" aria-label="Отправить">'+ic('send')+'</button></div>';
  const AI_CHIPS=['Объясни частицу 은/는','Чем отличается 이/가 от 은/는?','Проспрягай глагол 가다','Дай 5 слов о еде','Устрой мне мини-тест'];
  $('#ai-chips').innerHTML=AI_CHIPS.map(c=>'<button class="ai-chip">'+esc(c)+'</button>').join('');
  $$('#ai-chips .ai-chip').forEach(b=>b.onclick=()=>{$('#ai-input').value=b.textContent;sendAI();});
  $('#ai-fab').onclick=()=>{sfx('click');openAIChat();};
  $('#ai-close').onclick=()=>$('#ai-panel').classList.add('hidden');
  $('#ai-clear').onclick=()=>{if(confirm('Очистить историю переписки с AI?')){ensureAI();S.aiHist=[];saveProgress();renderAIMsgs();}};
  $('#ai-send').onclick=sendAI;
  $('#ai-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendAI();});}

/* ---------- старт ---------- */
function initApp(){
  loadUsers();
  renderNav();buildAIPanel();
  const ses=localStorage.getItem(LSK_SES);
  if(ses&&USERS[ses]){S=loadProgress(USERS[ses].name)||defaultState(USERS[ses].name);
    applyTheme();setShell(true);renderNav();updateTop();
    if(!S.placed)showLevelPick();else go('home');
  } else {applyTheme();setShell(false);showWelcome();}
}
window.addEventListener('beforeunload',()=>{if(S)saveProgress();});
initApp();
</script>
</body>
</html>
